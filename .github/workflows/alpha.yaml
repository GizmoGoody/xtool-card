# Publishes every push to main as a new alpha pre-release, once
# the CI checks pass, so the Marketplace (with the repository's Pre-release
# switch on) offers it as an update. The Marketplace only sees a new version
# when a new release tag is published, so each push gets its own tag:
# v0.1.0-alpha.<run number + 1> (alpha.1 was published by hand).
name: Alpha pre-release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: alpha
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        id: build
        run: |
          version="0.1.0-alpha.$((GITHUB_RUN_NUMBER + 1))"
          npm install --no-audit --no-fund
          VERSION="${version}" npm run build
          grep -q "${version}" dist/xtool-card.js
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          git log -1 --format=%B > notes.md
          gh release create "v${VERSION}" dist/xtool-card.js \
            --target "${GITHUB_SHA}" --prerelease --title "v${VERSION}" --notes-file notes.md
