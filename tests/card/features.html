<!doctype html>
<meta charset="utf-8">
<title>xTool card: tile features</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../xtool-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  const keysOf = (el) => [...el.shadowRoot.querySelectorAll(".key")];
  const keyNamed = (el, key) => el.shadowRoot.querySelector(`.key[data-key="${key}"]`);
  // Home Assistant's confirmation dialog: what it asks, if anything
  const asking = () => window.confirming;
  const lastAction = () => window.actions[window.actions.length - 1];
  const lastCall = (hass) => hass.calls[hass.calls.length - 1];

  runChecks(async () => {
    // Job: processing
    let hass = makeHass({ "sensor.f2_status": "processing" });
    let job = addFeature({ type: "custom:xtool-job" }, { hass });
    await wait(50);
    check("job, processing", keysOf(job).map((k) => k.dataset.key).join() === "pause,cancel", "Pause and Cancel");
    keyNamed(job, "pause").click();
    check("job, processing", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_pause" } }),
      "Pause presses the pause button");
    keyNamed(job, "cancel").click();
    await wait(20);
    check("job, processing", asking()?.title === "Cancel the job?" && asking().confirm_text === "Cancel the job" && asking().dismiss_text === "Keep it",
      "Cancel asks first, in Home Assistant's confirmation dialog");
    check("job, processing", JSON.stringify(lastAction()?.config.tap_action.target) === JSON.stringify({ entity_id: "button.f2_cancel" })
      && lastAction().config.tap_action.perform_action === "button.press" && lastAction().action === "tap", "as a perform-action, through Home Assistant's action handling");
    asking().answer(false);
    check("job, processing", lastCall(hass).data.entity_id === "button.f2_pause", "Keep it does not cancel");
    keyNamed(job, "cancel").click();
    await wait(20);
    asking().answer(true);
    check("job, processing", lastCall(hass).data.entity_id === "button.f2_cancel", "confirming cancels");

    // Job: idle and paused
    hass = makeHass({ "sensor.f2_status": "idle" });
    job = addFeature({ type: "custom:xtool-job" }, { hass });
    await wait(50);
    check("job, idle", keyNamed(job, "resume").textContent === "Start" && !keyNamed(job, "resume").disabled && keyNamed(job, "cancel").disabled,
      "Start, and Cancel off");
    hass = makeHass({ "sensor.f2_status": "paused" });
    job = addFeature({ type: "custom:xtool-job", confirm_cancel: false }, { hass });
    await wait(50);
    check("job, paused", keyNamed(job, "resume").textContent === "Resume", "Resume");
    keyNamed(job, "cancel").click();
    await wait(20);
    check("job, paused", !asking() && lastCall(hass).data.entity_id === "button.f2_cancel", "without asking, when turned off in the options");

    // Peripherals
    hass = makeHass({ "sensor.f2_status": "idle" });
    let row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    check("peripherals", keysOf(row).map((k) => k.dataset.key).join() === "power,exhaust,fill_light_front,fill_light_back,red_dot,autofocus",
      "every control the F2 Ultra UV has, in order, Autofocus last");
    check("peripherals", keyNamed(row, "power").querySelector("ha-state-icon")?.stateObj === hass.states["switch.f2_power"]
      && keyNamed(row, "power").querySelector("ha-state-icon").hass === hass && !keyNamed(row, "power").querySelector("span"),
      "icons by default: the entity's own icon, Home Assistant's state icon");
    check("peripherals", keyNamed(row, "exhaust").title === "Exhaust fan" && keyNamed(row, "red_dot").title === "Red dot", "titled with the entity's name");
    check("peripherals", !row.shadowRoot.querySelector(".key ha-icon:not(.arrow)"), "no icons of the card's own for the entities");
    keyNamed(row, "autofocus").click();
    check("peripherals", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_autofocus" } }),
      "Autofocus is pressed, not toggled");
    check("peripherals", keyNamed(row, "exhaust").getAttribute("aria-pressed") === "true" && keyNamed(row, "red_dot").getAttribute("aria-pressed") === "false",
      "on and off shown");
    keyNamed(row, "exhaust").click();
    check("peripherals", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_off", data: { entity_id: "switch.f2_exhaust" } }),
      "a tap turns the exhaust off");
    keyNamed(row, "fill_light_back").click();
    check("peripherals", lastCall(hass).domain === "light" && lastCall(hass).service === "turn_on", "a tap turns the back fill light on");
    keyNamed(row, "power").click();
    await wait(20);
    check("peripherals", !asking() && lastCall(hass).data.entity_id === "switch.f2_power", "Power turns off without asking while idle");
    hass = makeHass({ "sensor.f2_status": "processing" });
    row = addFeature({ type: "custom:xtool-peripherals", controls: ["red_dot", "power", "autofocus"], display: "both" }, { hass });
    await wait(50);
    check("peripherals, chosen", keysOf(row).map((k) => k.dataset.key).join() === "red_dot,power,autofocus" && keyNamed(row, "red_dot").textContent === "Dot"
      && keyNamed(row, "red_dot").querySelector("ha-state-icon"), "the chosen controls, in the chosen order; Show: Icons and names");
    check("peripherals, chosen", keyNamed(row, "autofocus").disabled, "no Autofocus while a job runs");
    keyNamed(row, "power").click();
    await wait(20);
    check("peripherals, chosen", asking()?.title === "Turn off power?" && hass.calls.length === 0, "Power asks first while a job runs");
    asking().answer(false);
    row = addFeature({ type: "custom:xtool-peripherals", controls: ["red_dot"], display: "names" }, { hass });
    await wait(50);
    check("show", keyNamed(row, "red_dot").textContent === "Dot" && !keyNamed(row, "red_dot").querySelector("ha-state-icon, ha-icon"), "Show: Names, one word, without icons");
    row = addFeature({ type: "custom:xtool-peripherals", controls: ["exhaust", "power"], display: "names" }, { hass });
    await wait(50);
    check("show", keysOf(row).map((k) => k.textContent).join() === "Exhaust,Power", "each name one word (Exhaust, not Exhaust fan)");

    // The fill lights stay buttons in the peripherals feature: on or off only
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    const front = keyNamed(row, "fill_light_front");
    check("fill lights as buttons", front.getAttribute("aria-pressed") === "true" && !front.classList.contains("dimmable"), "a button, with no dimming");
    front.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, clientX: 10, clientY: 10 }));
    front.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: 200, clientY: 10 }));
    front.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: 200, clientY: 10 }));
    check("fill lights as buttons", hass.calls.length === 0, "dragging across a button does nothing");
    front.click();
    check("fill lights as buttons", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "light", service: "turn_off", data: { entity_id: "light.f2_fill_front" } }),
      "a tap turns it off");
    const options = document.createElement("xtool-feature-editor");
    options.hass = makeHass();
    options.context = { entity_id: "sensor.f2_status" };
    options.setConfig({ type: "custom:xtool-peripherals" });
    const optionNames = options.querySelector("ha-form").schema.map((s) => s.name);
    check("fill lights as buttons", !optionNames.includes("dim_lights") && optionNames.includes("animate_fan"), `the options have no dimming (${optionNames.join(", ")})`);
    const showField = options.querySelector("ha-form").schema.find((s) => s.name === "display");
    check("show", !optionNames.includes("show_names") && showField?.selector.select.options.map((o) => o.label).join() === "Icons,Names,Icons and names"
      && options.querySelector("ha-form").data.display === "icons", "Show: Icons (the default), Names, or Icons and names");

    // Light: each light chosen as a light's tile card shows it, its icon and Home Assistant's brightness slider
    hass = makeHass();
    const bothLights = addFeature({ type: "custom:xtool-light" }, { hass });
    const reordered = addFeature({ type: "custom:xtool-light", controls: ["fill_light_back", "fill_light_front"] }, { hass });
    await wait(50);
    const lightRows = bothLights.shadowRoot.querySelectorAll(".light");
    const frontIcon = lightRows[0]?.querySelector("ha-tile-icon");
    const frontSlide = lightRows[0]?.querySelector(".slide hui-card-feature");
    check("light", lightRows.length === 2 && frontIcon?.interactive && frontIcon.querySelector('ha-state-icon[slot="icon"]')?.stateObj === hass.states["light.f2_fill_front"]
      && frontSlide?.feature.type === "light-brightness" && frontSlide.context.entity_id === "light.f2_fill_front",
      "Home Assistant's tile icon with the light's own icon, and its light brightness feature, for each light");
    check("light", [...reordered.shadowRoot.querySelectorAll(".slide hui-card-feature")].map((f) => f.context.entity_id).join() === "light.f2_fill_back,light.f2_fill_front",
      "in the order chosen");
    check("light", frontIcon.style.getPropertyValue("--tile-icon-color") === "rgb(214, 228, 255)"
      && lightRows[1].querySelector("ha-tile-icon").style.getPropertyValue("--tile-icon-color").includes("--state-light-inactive-color")
      && lightRows[0].querySelector(".slide").style.getPropertyValue("--feature-color") === "rgb(214, 228, 255)",
      "in the light's color: daylight when on, Home Assistant's off color when off");
    frontIcon.click();
    check("light", lastAction()?.config.tap_action.perform_action === "light.toggle" && JSON.stringify(lastCall(hass)) ===
      JSON.stringify({ domain: "light", service: "toggle", data: { entity_id: "light.f2_fill_front" } }), "a tap on the icon turns the light on or off, through Home Assistant's action handling");
    const slideAt = (feature, value) => {
      const inner = feature.shadowRoot.querySelector(".slide hui-card-feature").shadowRoot.firstElementChild;
      const slider = document.createElement("div");
      slider.min = 1;
      inner.append(slider);
      slider.dispatchEvent(new CustomEvent("value-changed", { bubbles: true, composed: true, detail: { value } }));
    };
    let sentBefore = hass.calls.length;
    slideAt(bothLights, 1);
    check("light, off at the minimum", hass.calls.length === sentBefore, "by default the minimum is 1 %, not off");
    const offAtMinimum = addFeature({ type: "custom:xtool-light", controls: ["fill_light_front"], off_at_minimum: true }, { hass });
    await wait(50);
    slideAt(offAtMinimum, 40);
    check("light, off at the minimum", hass.calls.length === sentBefore, "a slide above the minimum is Home Assistant's own");
    slideAt(offAtMinimum, 1);
    check("light, off at the minimum", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "light", service: "turn_off", data: { entity_id: "light.f2_fill_front" } }),
      "with the option on, the minimum turns the light off");
    bothLights.hass = makeHass({ "light.f2_fill_front": { state: "on", attributes: { rgb_color: [255, 0, 0] } } });
    check("light", bothLights.shadowRoot.querySelectorAll(".light")[0] === lightRows[0] && frontIcon.style.getPropertyValue("--tile-icon-color") === "rgb(255, 0, 0)",
      "a light's own color, when it has one; the same row stays");
    const stub = customElements.get("xtool-light").getStubConfig(makeHass(), { entity_id: "sensor.f2_status" });
    check("light", stub.controls.join() === "fill_light_front,fill_light_back", "a new feature shows every light");
    const lightOptions = document.createElement("xtool-feature-editor");
    lightOptions.hass = makeHass();
    lightOptions.context = { entity_id: "sensor.f2_status" };
    lightOptions.setConfig({ type: "custom:xtool-light", controls: ["fill_light_back"] });
    const lightForm = lightOptions.querySelector("ha-form");
    check("light, options", lightForm.data.controls.join() === "fill_light_back" && lightForm.schema[0].selector.select.reorder
      && lightForm.schema[0].selector.select.options.map((o) => o.label).join() === "Fill light (front),Fill light (back)"
      && lightForm.data.off_at_minimum === false && lightForm.schema.some((f) => f.name === "off_at_minimum"),
      "the editor offers each light by name, in order, and Turn off at the minimum (off by default)");
    check("light", window.customCardFeatures.find((f) => f.type === "xtool-light")?.name === "xTool light"
      && !window.customCardFeatures.some((f) => f.type === "xtool-fill-light"), "named Light, in place of Fill light brightness");
    const noLights = makeHass();
    delete noLights.entities["light.f2_fill_front"];
    delete noLights.entities["light.f2_fill_back"];
    const none = addFeature({ type: "custom:xtool-light" }, { hass: noLights });
    await wait(50);
    check("light", !none.shadowRoot.querySelector(".light") && !window.customCardFeatures.find((f) => f.type === "xtool-light").isSupported(noLights, { entity_id: "sensor.f2_status" }),
      "none for a laser without lights");
    const p2Lights = addFeature({ type: "custom:xtool-light" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("light, P2", [...p2Lights.shadowRoot.querySelectorAll(".slide hui-card-feature")].map((f) => f.context.entity_id).join()
      === "light.p2_fill_left,light.p2_fill_right,light.p2_close_light", "the P2's left, right and close fill lights");

    // Animate fan: the exhaust's icon turns while it runs
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass() });
    await wait(50);
    check("animate fan", keyNamed(row, "exhaust").querySelector("ha-state-icon").classList.contains("spin"), "the running exhaust fan turns");
    check("animate fan", !keyNamed(row, "red_dot").querySelector("ha-state-icon").classList.contains("spin"), "other icons do not");
    row = addFeature({ type: "custom:xtool-peripherals", animate_fan: false }, { hass: makeHass() });
    await wait(50);
    check("animate fan", !keyNamed(row, "exhaust").querySelector("ha-state-icon").classList.contains("spin"), "it can be turned off");
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass({ "switch.f2_exhaust": "off" }) });
    await wait(50);
    check("animate fan", !keyNamed(row, "exhaust").querySelector("ha-state-icon").classList.contains("spin"), "a fan that is off is still");

    row = addFeature({ type: "custom:xtool-peripherals" }, { hass: makeHass(), entityId: "sensor.p2_status" });
    await wait(50);
    check("direction, P2", keyNamed(row, "fill_light_left")?.querySelector(".arrow").icon === "mdi:arrow-left"
      && keyNamed(row, "fill_light_right")?.querySelector(".arrow").icon === "mdi:arrow-right" && !keyNamed(row, "fill_light").querySelector(".arrow"),
      "the P2's left and right fill lights: left and right arrows");

    // Safety checks
    hass = makeHass({ "switch.f2_moved": "off" });
    row = addFeature({ type: "custom:xtool-safety" }, { hass });
    await wait(50);
    check("safety", keysOf(row).map((k) => k.dataset.key).join() === "flame_alarm,enclosure_stop,moved_stop,safety_key,access_control",
      "the three checks, the safety key and Access control");
    let keyOpened;
    row.addEventListener("hass-more-info", (ev) => (keyOpened = ev.detail.entityId));
    keyNamed(row, "safety_key").click();
    check("safety", keyOpened === "binary_sensor.f2_safety_key" && hass.calls.length === 0 && keyNamed(row, "safety_key").getAttribute("aria-pressed") === "true",
      "the safety key is shown (in: green); a tap opens it, nothing is switched");
    const access = keyNamed(row, "access_control");
    check("safety, access control", !access.classList.contains("fill") && access.style.getPropertyValue("--c") === "var(--green-color)" && access.getAttribute("aria-pressed") === "false",
      "Access control off is plain, not a red warning");
    const moved = keyNamed(row, "moved_stop"), flame = keyNamed(row, "flame_alarm");
    check("safety", moved.classList.contains("fill") && moved.style.getPropertyValue("--c") === "var(--red-color)" && moved.getAttribute("aria-pressed") === "false",
      "a check that is off is red");
    check("safety", !flame.classList.contains("fill") && flame.style.getPropertyValue("--c") === "var(--green-color)" && flame.getAttribute("aria-pressed") === "true",
      "a check that is on is green");
    check("safety", !row.shadowRoot.querySelector(".warn, i"), "no dots");
    keyNamed(row, "moved_stop").click();
    await wait(20);
    check("safety", !asking() && lastCall(hass).service === "turn_on", "turning a check on does not ask");
    keyNamed(row, "flame_alarm").click();
    await wait(20);
    check("safety", asking()?.text.includes("No flame alarm will be triggered") && asking().confirm_text === "Turn off" && asking().dismiss_text === "Keep on",
      "turning the flame alarm off asks, with xTool's warning: Turn off or Keep on");
    check("safety", !document.querySelector("dialog") && !row.shadowRoot.querySelector("dialog"), "no dialog of the card's own");
    asking().answer(true);
    check("safety", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_off", data: { entity_id: "switch.f2_flame" } }),
      "confirming turns it off");
    keyNamed(row, "access_control").click();
    await wait(20);
    check("safety, access control", asking()?.text.includes("autofocus, framing and starting from the machine are turned off") && asking().confirm_text === "Turn on"
      && asking().dismiss_text === "Keep off",
      "turning Access control on asks, and says what it turns off");
    asking().answer(true);
    check("safety, access control", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "switch", service: "turn_on", data: { entity_id: "switch.f2_access_control" } }),
      "confirming turns it on");

    // While Access control is on, what it turns off is unavailable
    hass = makeHass({ "switch.f2_access_control": "on" });
    row = addFeature({ type: "custom:xtool-safety" }, { hass });
    await wait(50);
    check("access control on", keyNamed(row, "access_control").getAttribute("aria-pressed") === "true", "on is pressed");
    keyNamed(row, "access_control").click();
    await wait(20);
    check("access control on", asking()?.confirm_text === "Turn off", "turning it off asks");
    asking().answer(false);
    row = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    await wait(50);
    check("access control on", keyNamed(row, "autofocus").disabled && !keyNamed(row, "power").disabled, "Autofocus in Controls is unavailable, the rest is not");
    job = addFeature({ type: "custom:xtool-job", controls: ["start", "pause", "cancel"] }, { hass });
    await wait(50);
    check("access control on", keyNamed(job, "resume").disabled && keyNamed(job, "pause").disabled,
      "no Start (from the machine) and no Pause, as in Studio");
    job = addFeature({ type: "custom:xtool-job", controls: ["pause", "cancel"] }, { hass: makeHass({ "switch.f2_access_control": "on", "sensor.f2_status": "processing" }) });
    await wait(50);
    check("access control on", keyNamed(job, "pause").disabled && !keyNamed(job, "cancel").disabled, "no Pause while a job runs; Cancel stays");
    job = addFeature({ type: "custom:xtool-job", controls: ["start"] }, { hass: makeHass({ "switch.f2_access_control": "on", "sensor.f2_status": "paused" }) });
    await wait(50);
    check("access control on", !keyNamed(job, "resume").disabled, "a paused job can still be resumed");

    // Settings: the laser's own
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-settings" }, { hass });
    await wait(50);
    check("settings", keysOf(row).map((k) => k.dataset.key).join() === "buzzer,if2_buzzer,device_sleep", "buzzer reminders, the IF2 buzzer, device sleep");
    const p2Settings = addFeature({ type: "custom:xtool-settings", display: "names" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("settings, P2", keysOf(p2Settings).map((k) => k.dataset.key).join() === "exhaust_setting,buzzer,flame_alarm_level"
      && keysOf(p2Settings).map((k) => k.textContent).join() === "Exhaust,Buzzer,high", "the P2's settings: exhaust fan, buzzer and flame alarm level");
    const p2Parts = addFeature({ type: "custom:xtool-peripherals" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("settings, P2", !keyNamed(p2Parts, "exhaust_setting") && !keyNamed(p2Parts, "buzzer") && keyNamed(p2Parts, "red_dot")
      && !keyNamed(row, "power") && !keyNamed(row, "exhaust"),
      "the integration's config entities are in Configuration, every other one in Controls");
    const configExhaust = makeHass();
    configExhaust.entities["switch.f2_exhaust"].entity_category = "config";
    const movedSettings = addFeature({ type: "custom:xtool-settings" }, { hass: configExhaust });
    const movedControls = addFeature({ type: "custom:xtool-peripherals" }, { hass: configExhaust });
    await wait(50);
    check("settings", keyNamed(movedSettings, "exhaust") && !keyNamed(movedControls, "exhaust"), "one rule for every entity: a config entity moves to Configuration");
    keyNamed(p2Settings, "flame_alarm_level").click();
    check("settings, P2", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "select", service: "select_option", data: { entity_id: "select.p2_flame_level", option: "low" } })
      && keyNamed(p2Settings, "flame_alarm_level").title === "Flame alarm: high. Tap for low", "a tap steps the flame alarm to the next level");
    const settingsOptions = document.createElement("xtool-feature-editor");
    settingsOptions.hass = hass;
    settingsOptions.context = { entity_id: "sensor.p2_status" };
    settingsOptions.setConfig({ type: "custom:xtool-settings" });
    check("settings, P2", settingsOptions.querySelector("ha-form").schema[0].selector.select.options.map((o) => o.label).join() === "Exhaust fan,Buzzer,Flame alarm",
      "the editor offers each by its entity's name");
    keyNamed(row, "device_sleep").click();
    await wait(20);
    check("settings", !asking() && lastCall(hass).domain === "switch", "a setting turns on and off with a tap, without asking");

    // No Accessories feature: the IF2 buzzer is in Configuration
    check("accessories", !window.customCardFeatures.some((f) => f.type === "xtool-accessories") && !customElements.get("xtool-accessories")
      && window.customCardFeatures.find((f) => f.type === "xtool-peripherals").name === "xTool controls"
      && window.customCardFeatures.find((f) => f.type === "xtool-safety").name === "xTool safety"
      && window.customCardFeatures.find((f) => f.type === "xtool-settings").name === "xTool configuration",
      "the picker offers xTool controls, xTool safety and xTool configuration, and no xTool accessories");
    row = addFeature({ type: "custom:xtool-settings", controls: ["if2_buzzer"] }, { hass });
    await wait(50);
    keyNamed(row, "if2_buzzer").click();
    check("settings", lastCall(hass).data.entity_id === "switch.if2_buzzer", "the IF2 buzzer, found on the accessory device");
    row = addFeature({ type: "custom:xtool-settings" }, { hass: makeHass({ "switch.if2_buzzer": "unavailable" }) });
    await wait(50);
    check("settings", keyNamed(row, "if2_buzzer")?.disabled, "kept in place, disabled, while the IF2 is unavailable");

    // Camera: Home Assistant's own image element, with buttons to switch cameras
    hass = makeHass();
    const camera = addFeature({ type: "custom:xtool-camera" }, { hass });
    await wait(80);
    const image = camera.shadowRoot.querySelector(".shot hui-image");
    check("camera", image?.cameraImage === "camera.f2_main" && image.entity === "camera.f2_main" && image.cameraView === "auto" && image.hass === hass,
      "Home Assistant's image element shows the main camera, in the Auto view");
    check("camera", !camera.shadowRoot.querySelector(".shot > img"), "no picture of the card's own");
    const topKeys = keysOf;
    check("camera", topKeys(camera).map((k) => k.textContent).join() === "Main,Deep,Crop", "buttons for both cameras, and Crop for the main camera");
    keyNamed(camera, "camera.f2_deep").click();
    await wait(50);
    const shown = () => [...camera.shadowRoot.querySelectorAll(".shot hui-image:not(.next)")].filter((i) => !i.hidden);
    check("camera", shown().length === 1 && shown()[0].cameraImage === "camera.f2_deep" && image.hidden && image.isConnected,
      "switching shows the deep camera's image; the main camera's stays, hidden, with its picture");

      `Keys (all, in order, by default) and Show (${fanForm.schema.map((s) => s.name).join(", ")})`);
    fan = addFeature({ type: "custom:xtool-if2-fan", controls: ["speed", "off"] }, { hass: makeHass() });
    await wait(60);
    check("IF2 fan, keys", keysOf(fan).map((k) => k.dataset.key).join() === "speed,off", "only the keys chosen, in the order chosen");

    // The first IF2: its gear select, in the same control
    const firstIf2 = () => {
      const h = makeHass();
      delete h.entities["fan.if2_fan"];
      delete h.states["fan.if2_fan"];
      h.entities["select.if2_gear"] = { entity_id: "select.if2_gear", device_id: "dev_if2", platform: "xtool", translation_key: "accessory_ductfan_gear_select" };
      h.states["select.if2_gear"] = { entity_id: "select.if2_gear", state: "2", attributes: { friendly_name: "IF2 gear", options: ["Off", "1", "2", "3", "4"] } };
      return h;
    };
    hass = firstIf2();
    fan = addFeature({ type: "custom:xtool-if2-fan", options: ["Off", "4"] }, { hass });
    await wait(60);
    check("first IF2", keysOf(fan).map((k) => k.dataset.key).join() === "Off,4" && !keysOf(fan).some((k) => k.getAttribute("aria-pressed") === "true"),
      "the chosen gears, as keys");
    keyNamed(fan, "4").click();
    check("first IF2", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "select", service: "select_option", data: { entity_id: "select.if2_gear", option: "4" } }),
      "a tap selects the gear");
    check("feature picker", window.customCardFeatures.find((f) => f.type === "xtool-if2-fan").isSupported(hass, { entity_id: "sensor.f2_status" }),
      "offered for the first IF2");

    hass = makeHass();
    const noFan = addFeature({ type: "custom:xtool-if2-fan" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("IF2 fan", keysOf(noFan).length === 0, "nothing for a laser without an IF2");
    const unseen = addFeature({ type: "custom:xtool-if2-fan" }, { hass: makeHass({ "fan.if2_fan": "unavailable" }) });
    await wait(60);
    check("IF2 fan, unavailable", unseen.style.display === "" && keysOf(unseen).length > 0 && keysOf(unseen).every((k) => k.disabled),
      "kept in place, disabled, while the laser does not see the IF2");

    // Focus: Autofocus, then down and up around a field to type the thickness, in one row
    hass = makeHass();
    let focus = addFeature({ type: "custom:xtool-focus" }, { hass });
    await wait(50);
    const field = () => focus.shadowRoot.querySelector(".row .field input");
    check("focus", [...focus.shadowRoot.querySelectorAll(".row .key, .row .field")].map((c) => c.dataset.key ?? c.className).join() === "autofocus,down,field,up"
      && field().value === "36.1" && !focus.shadowRoot.querySelector(".field .unit"),
      "Autofocus, down, the thickness (36.1 mm) in a field, up");
    const fiveKeys = addFeature({ type: "custom:xtool-peripherals", controls: ["power", "exhaust", "red_dot", "fill_light_front", "fill_light_back"] }, { hass });
    await wait(50);
    const widthOf = (feature, key) => keyNamed(feature, key).getBoundingClientRect().width;
    check("focus", ["autofocus", "down", "up"].every((key) => Math.abs(widthOf(focus, key) - widthOf(fiveKeys, "power")) < 0.5)
      && focus.shadowRoot.querySelector(".field").getBoundingClientRect().width > widthOf(focus, "up"),
      `each button as wide as one of five Controls buttons, the field wider (${widthOf(focus, "up")}, ${widthOf(fiveKeys, "power")})`);
    check("focus", keyNamed(focus, "down").querySelector("ha-icon")?.icon === "mdi:arrow-down" && keyNamed(focus, "up").querySelector("ha-icon")?.icon === "mdi:arrow-up",
      "down and up arrows");
    keyNamed(focus, "autofocus").click();
    check("focus", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.f2_autofocus" } }),
      "Autofocus is pressed");
    keyNamed(focus, "up").click();
    check("focus", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "number", service: "set_value", data: { entity_id: "number.f2_focus_height", value: 36.2 } }),
      "+ moves the head up by the step (0.1 mm)");
    keyNamed(focus, "down").click();
    check("focus", lastCall(hass).data.value === 36, "- moves it down");
    field().value = "40,5";
    field().dispatchEvent(new Event("change"));
    check("focus, typed", lastCall(hass).data.value === 40.5, "typing a thickness focuses there (a decimal comma works)");
    const calls = hass.calls.length;
    field().value = "abc";
    field().dispatchEvent(new Event("change"));
    check("focus, typed", hass.calls.length === calls && field().value === "36.1", "something that is not a number is put back");
    focus = addFeature({ type: "custom:xtool-focus", step: 0.5 }, { hass: makeHass({ "number.f2_focus_height": "149.95" }) });
    await wait(50);
    const focusHass = focus._hass;
    keyNamed(focus, "up").click();
    check("focus", lastCall(focusHass).data.value === 150, "always 0.1 mm a step, kept within the height's range");
    const whole50 = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "number.f2_focus_height": "50" }) });
    await wait(50);
    check("focus", whole50.shadowRoot.querySelector(".row .field input").value === "50.0", "always one decimal: 50.0, not 50");
    check("focus, options", !customElements.get("xtool-focus").getConfigElement
      && !window.customCardFeatures.find((f) => f.type === "xtool-focus").configurable, "no options");
    focus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "sensor.f2_engraving_lens": "small" }) });
    await wait(50);
    check("focus, inner lens", focus.style.display === "none" && keysOf(focus).length === 0,
      "with the inner engraving lens there is no focusing, so the feature is not shown");
    focus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "sensor.f2_status": "processing" }) });
    await wait(50);
    check("focus, busy", keyNamed(focus, "autofocus").disabled && !keyNamed(focus, "up").disabled, "no Autofocus while a job runs");
    focus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "switch.f2_access_control": "on" }) });
    await wait(50);
    check("focus, access control", keyNamed(focus, "autofocus").disabled && !keyNamed(focus, "up").disabled && !field().disabled,
      "no Autofocus while Access control is on; the thickness can still be set");
    const p2Focus = addFeature({ type: "custom:xtool-focus" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("focus", keysOf(p2Focus).length === 0 && !p2Focus.shadowRoot.querySelector(".field input"), "nothing for a laser without focus controls");
    const offFocus = addFeature({ type: "custom:xtool-focus" }, { hass: makeHass({ "sensor.f2_status": "off", "number.f2_focus_height": "unavailable" }) });
    await wait(50);
    check("focus, off", offFocus.style.display === "" && keyNamed(offFocus, "up")?.disabled && keyNamed(offFocus, "autofocus")?.disabled && offFocus.shadowRoot.querySelector(".field input")?.disabled,
      "kept in place, disabled, while the laser is off");

    // Job: the buttons chosen, in order
    hass = makeHass({ "sensor.f2_status": "processing" });
    job = addFeature({ type: "custom:xtool-job", controls: ["cancel", "start", "pause"] }, { hass });
    await wait(50);
    check("job, chosen", keysOf(job).map((k) => k.dataset.key).join() === "cancel,resume,pause" && keyNamed(job, "resume").disabled && !keyNamed(job, "pause").disabled,
      "Cancel, Start and Pause apart, in the chosen order; Start is off while the job runs");
    job = addFeature({ type: "custom:xtool-job", controls: ["start_pause"] }, { hass: makeHass({ "sensor.f2_status": "paused" }) });
    await wait(50);
    check("job, chosen", keysOf(job).map((k) => k.textContent).join() === "Resume", "Start / Pause alone: Resume while paused");
    const jobOptions = document.createElement("xtool-feature-editor");
    jobOptions.hass = hass;
    jobOptions.context = { entity_id: "sensor.f2_status" };
    jobOptions.setConfig({ type: "custom:xtool-job" });
    const jobForm = jobOptions.querySelector("ha-form");
    check("job, options", jobForm.data.controls.join() === "start_pause,cancel"
      && jobForm.schema[0].selector.select.options.map((o) => o.label).join() === "Start / Pause,Resume job,Pause job,Cancel job" && jobForm.schema[0].selector.select.reorder,
      "Buttons: Start / Pause and Cancel by default, from Start / Pause and the job's buttons by their entities' names, in order");

    // Keys: one width for every feature, never narrower than the icon, wrapping instead of overflowing
    hass = makeHass();
    const jobKeys = addFeature({ type: "custom:xtool-job" }, { hass });
    const allControls = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    const narrow = addFeature({ type: "custom:xtool-peripherals" }, { hass });
    narrow.parentElement.style.width = "150px";
    await wait(50);
    const widths = [...keysOf(jobKeys), ...keysOf(allControls)].map((k) => Math.round(k.getBoundingClientRect().width));
    check("keys", new Set(widths).size === 1 && widths[0] === Math.round((420 - 4 * 12) / 5),
      `every key a fifth of the feature, in every feature (${widths.join(", ")})`);
    const narrowKeys = keysOf(narrow).map((k) => k.getBoundingClientRect());
    check("keys", narrowKeys.every((b) => b.width >= 36) && narrowKeys.every((b) => b.right <= narrow.getBoundingClientRect().right + 0.5)
      && new Set(narrowKeys.map((b) => Math.round(b.top))).size > 1,
      `in a narrow feature never narrower than the icon; the keys wrap instead of overflowing (${narrowKeys.map((b) => Math.round(b.width)).join(", ")})`);
    check("keys", keysOf(allControls).every((k) => getComputedStyle(k.querySelector("ha-state-icon, ha-icon")).getPropertyValue("--mdc-icon-size").trim() === "24px"),
      "the icon keeps its size");

    // Several of one kind: an arrow under the icon for where each sits
    const frontKey = keyNamed(allControls, "fill_light_front"), backKey = keyNamed(allControls, "fill_light_back");
    const arrowOf = (key) => key.querySelector(".glyph > ha-state-icon + ha-icon.arrow")?.icon;
    check("direction", arrowOf(frontKey) === "mdi:arrow-down" && arrowOf(backKey) === "mdi:arrow-up" && !keyNamed(allControls, "power").querySelector(".arrow")
      && frontKey.querySelectorAll("ha-state-icon").length === 1, "front: down, back: up, under the light's one icon; none for a part there is one of");
    const named = addFeature({ type: "custom:xtool-peripherals", controls: ["fill_light_front"], display: "names" }, { hass });
    await wait(50);
    check("direction", keyNamed(named, "fill_light_front").querySelector(".glyph > span + ha-icon.arrow") && keyNamed(named, "fill_light_front").textContent === "Light",
      "Show: Names: the arrow under the name");
    const oneLight = makeHass();
    delete oneLight.entities["light.f2_fill_back"];
    const single = addFeature({ type: "custom:xtool-peripherals" }, { hass: oneLight });
    await wait(50);
    check("direction", keyNamed(single, "fill_light_front") && !keyNamed(single, "fill_light_front").querySelector(".arrow"), "no arrow when the laser has one fill light");

    // Position: X,Y in one field, a key to slide X before it and one to slide Y after it, Move and Home
    const press = (key, type, x, y) => key.dispatchEvent(new PointerEvent(type, { bubbles: true, composed: true, clientX: x, clientY: y, button: 0, pointerId: 7 }));
    const items = (feature) => [...feature.shadowRoot.querySelectorAll(".row .key, .row .field")].map((c) => c.dataset.key ?? c.className).join();
    hass = makeHass();
    let position = addFeature({ type: "custom:xtool-position" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    const xy = () => position.shadowRoot.querySelector(".field input");
    check("position", items(position) === "x,field,y,move_laser,home_laser" && xy().value === "100.0,50.0"
      && !keyNamed(position, "up") && !keyNamed(position, "down") && !position.shadowRoot.querySelector("hui-card-feature"),
      `X and Y in one field (${xy().value}), slide keys around it, then Move and Home; no + or - keys`);
    check("position", keyNamed(position, "x").querySelector("ha-icon").icon === "mdi:arrow-left-right" && keyNamed(position, "y").querySelector("ha-icon").icon === "mdi:arrow-up-down"
      && keyNamed(position, "move_laser").textContent === "Move" && position.style.getPropertyValue("--feature-color").includes("--state-number-active-color"),
      "a left-right key for X, an up-down key for Y; in the number color");
    check("position", window.customCardFeatures.find((f) => f.type === "xtool-position").name === "xTool position"
      && !window.customCardFeatures.some((f) => f.type === "xtool-laser") && !customElements.get("xtool-laser"), "named Position, in place of Laser position");
    xy().value = "120, 60.5";
    xy().dispatchEvent(new Event("change"));
    check("position, typed", JSON.stringify(hass.calls.slice(-2)) === JSON.stringify([
      { domain: "number", service: "set_value", data: { entity_id: "number.p2_laser_x", value: 120 } },
      { domain: "number", service: "set_value", data: { entity_id: "number.p2_laser_y", value: 60.5 } }]), "typing X,Y sets both");
    xy().value = "120";
    xy().dispatchEvent(new Event("change"));
    check("position, typed", xy().value === "100.0,50.0" && hass.calls.length === 2, "one number alone is put back");
    let sent = hass.calls.length;
    press(keyNamed(position, "x"), "pointerdown", 100, 10);
    press(keyNamed(position, "x"), "pointermove", 130, 10);
    await wait(120);
    const slow = Number(xy().value.split(",")[0]);
    check("position, slide", slow > 100 && hass.calls.length === sent && xy().value.endsWith(",50.0"),
      `press, then slide right: X rises in the field (${xy().value}), nothing is set yet`);
    press(keyNamed(position, "x"), "pointermove", 220, 10);
    await wait(120);
    const fast = Number(xy().value.split(",")[0]);
    check("position, slide", fast - slow > slow - 100, `farther from the press, faster (${slow}, then ${fast})`);
    press(keyNamed(position, "x"), "pointerup", 220, 10);
    check("position, slide", hass.calls.length === sent + 1 && lastCall(hass).data.entity_id === "number.p2_laser_x" && lastCall(hass).data.value === fast,
      "letting go sets X");
    sent = hass.calls.length;
    press(keyNamed(position, "y"), "pointerdown", 10, 10);
    press(keyNamed(position, "y"), "pointermove", 10, 60);
    await wait(120);
    press(keyNamed(position, "y"), "pointerup", 10, 60);
    check("position, slide", hass.calls.length === sent + 1 && lastCall(hass).data.entity_id === "number.p2_laser_y" && lastCall(hass).data.value > 50,
      "the up-down key slides Y: down, toward the front, raises it");
    press(keyNamed(position, "x"), "pointerdown", 100, 10);
    press(keyNamed(position, "x"), "pointermove", 40, 10);
    await wait(120);
    press(keyNamed(position, "x"), "pointerup", 40, 10);
    check("position, slide", lastCall(hass).data.entity_id === "number.p2_laser_x" && lastCall(hass).data.value < 100, "left lowers X");
    keyNamed(position, "x").dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowLeft", bubbles: true }));
    check("position, slide", lastCall(hass).data.value === 99.9, "the arrow keys move it one step");
    position = addFeature({ type: "custom:xtool-position", controls: ["home_laser", "position"] }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("position, chosen", items(position) === "home_laser,x,field,y", "only the controls chosen, in order");
    const positionOptions = document.createElement("xtool-feature-editor");
    positionOptions.hass = hass;
    positionOptions.context = { entity_id: "sensor.p2_status" };
    positionOptions.setConfig({ type: "custom:xtool-position" });
    check("position, options", positionOptions.querySelector("ha-form").schema[0].selector.select.options.map((o) => o.label).join() === "Laser position X, Laser position Y,Move laser,Home laser head"
      && positionOptions.querySelector("ha-form").schema[0].selector.select.reorder, "Position, Move and Home can be chosen and ordered");

    // Measure: the Measure key and the thickness or distance in a field, with a plus-minus key to slide it
    hass = makeHass();
    let measure = addFeature({ type: "custom:xtool-measure" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    const thickness = () => measure.shadowRoot.querySelector(".field input");
    check("measure", items(measure) === "measure,field,adjust" && thickness().value === "3.0" && keyNamed(measure, "measure").textContent === "Measure"
      && keyNamed(measure, "measure").title === "Measure thickness or distance. Last reading: 3.2 mm" && !measure.shadowRoot.querySelector("hui-card-feature, select"),
      "Measure, the field, and the plus-minus key, in one row; no Mode");
    check("measure", keyNamed(measure, "adjust").querySelector("ha-icon").icon === "mdi:plus-minus", "the plus-minus key");
    sent = hass.calls.length;
    press(keyNamed(measure, "adjust"), "pointerdown", 100, 100);
    press(keyNamed(measure, "adjust"), "pointermove", 100, 60);
    await wait(120);
    press(keyNamed(measure, "adjust"), "pointerup", 100, 60);
    check("measure, slide", hass.calls.length === sent + 1 && lastCall(hass).data.entity_id === "number.p2_thickness" && lastCall(hass).data.value > 3,
      "sliding up raises it");
    press(keyNamed(measure, "adjust"), "pointerdown", 100, 100);
    press(keyNamed(measure, "adjust"), "pointermove", 60, 100);
    await wait(120);
    press(keyNamed(measure, "adjust"), "pointerup", 60, 100);
    check("measure, slide", lastCall(hass).data.value < 3, "sliding left lowers it");
    keyNamed(measure, "measure").click();
    check("measure", JSON.stringify(lastCall(hass)) === JSON.stringify({ domain: "button", service: "press", data: { entity_id: "button.p2_measure" } }), "Measure measures");
    measure = addFeature({ type: "custom:xtool-measure", controls: ["measure_height", "measure"] }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("measure, chosen", items(measure) === "field,adjust,measure", "the field (with its key) and Measure, in the order chosen");
    const measureOptions = document.createElement("xtool-feature-editor");
    measureOptions.hass = hass;
    measureOptions.context = { entity_id: "sensor.p2_status" };
    measureOptions.setConfig({ type: "custom:xtool-measure" });
    check("measure, options", measureOptions.querySelector("ha-form").schema[0].selector.select.options.map((o) => o.label).join() === "Measure thickness or distance,Thickness or distance",
      "only Measure and the field can be chosen");

    // A field being typed in keeps its focus and what was typed while the states change
    position = addFeature({ type: "custom:xtool-position" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    const typing = position.shadowRoot.querySelector(".field input");
    typing.focus();
    typing.value = "1,2";
    position.hass = makeHass({ "number.p2_laser_x": "101", "sensor.p2_status": "processing" });
    await wait(20);
    check("field", position.shadowRoot.activeElement === typing && typing.value === "1,2" && keyNamed(position, "move_laser").disabled,
      "the field keeps its focus and what is typed while the keys change");
    typing.blur();

    // A laser without the parts: nothing to show
    hass = makeHass();
    row = addFeature({ type: "custom:xtool-safety" }, { hass, entityId: "sensor.p2_status" });
    await wait(50);
    check("P2 safety", keysOf(row).every((k) => ["cover_open", "baseplate"].includes(k.dataset.key)), "no switches for checks the laser does not have (only the lid and baseplate, which it reports)");

    // The features are offered only for lasers that have their parts
    const offered = Object.fromEntries(window.customCardFeatures.map((f) => [f.type, f.isSupported(makeHass(), { entity_id: "sensor.p2_status" })]));
    check("feature picker", offered["xtool-job"] && offered["xtool-peripherals"] && offered["xtool-light"] && offered["xtool-overlay"] && !offered["xtool-if2-fan"] && offered["xtool-position"] && offered["xtool-measure"] && offered["xtool-camera"] && !offered["xtool-focus"],
      `offered for the P2: ${Object.entries(offered).filter(([, v]) => v).map(([k]) => k).join(", ")}`);
  });
</script>
