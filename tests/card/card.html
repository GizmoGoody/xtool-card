<!doctype html>
<meta charset="utf-8">
<title>xTool card: pictures, badges, progress and styles</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  #cards { display: flex; flex-wrap: wrap; gap: 12px 20px; }
  figure { margin: 0; } figcaption { margin-bottom: 4px; color: #aaa; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../xtool-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  const f2 = (status, more = {}) => makeHass({ "sensor.f2_status": status, ...more });
  const p2 = (status, more = {}) => makeHass({ "sensor.p2_status": status, ...more });
  const jobFeatures = { features_position: "bottom", features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }] };

  // The state pictures
  const pictures = {
    idle: addCard("idle", {}, { hass: f2("idle") }),
    galvo: addCard("F2 processing", {}, { hass: f2("processing") }),
    raster: addCard("P2 processing", { entity: "sensor.p2_status" }, { hass: p2("processing") }),
    paused: addCard("paused", {}, { hass: f2("paused") }),
    finished: addCard("finished", { state_content: ["state", "job_time"] }, { hass: f2("finished") }),
    sleeping: addCard("sleeping", {}, { hass: f2("sleeping") }),
    framing: addCard("framing", {}, { hass: f2("framing") }),
    error: addCard("error", {}, { hass: f2("error_limit") }),
    fire: addCard("fire warning", {}, { hass: f2("error_fire_warning") }),
    off: addCard("off", {}, { hass: f2("off") }),
  };

  // Badges
  const badges = {
    none: addCard("no badge", {}, { hass: f2("idle") }),
    key: addCard("safety key out", {}, { hass: f2("idle", { "binary_sensor.f2_safety_key": "off" }) }),
    safetyOff: addCard("a safety check off", {}, { hass: f2("idle", { "switch.f2_moved": "off" }) }),
    offline: addCard("unavailable", {}, { hass: f2("unavailable") }),
    chosen: addCard("badges turned off", { status_badge: [] }, { hass: f2("idle", { "binary_sensor.f2_safety_key": "off" }) }),
    lid: addCard("P2 lid open", { entity: "sensor.p2_status" }, { hass: p2("idle", { "binary_sensor.p2_cover": "on" }) }),
    alarmFirst: addCard("alarm, then safety key", { status_badge: ["alarm", "safety_key"] },
      { hass: f2("idle", { "binary_sensor.f2_alarm": "on", "binary_sensor.f2_safety_key": "off" }) }),
    keyFirst: addCard("safety key, then alarm", { status_badge: ["safety_key", "alarm"] },
      { hass: f2("idle", { "binary_sensor.f2_alarm": "on", "binary_sensor.f2_safety_key": "off" }) }),
    firstApplies: addCard("lid first, but closed", { status_badge: ["lid", "safety_key"] },
      { hass: f2("idle", { "binary_sensor.f2_safety_key": "off" }) }),
    ethernet: addCard("P2 on Ethernet, lid open", { entity: "sensor.p2_status" }, { hass: p2("idle", { "binary_sensor.p2_cover": "on" }) }),
    wifi: addCard("P2 on Wi-Fi", { entity: "sensor.p2_status" }, { hass: p2("idle", { "sensor.p2_connection": "wifi" }) }),
    noLink: addCard("connection badge turned off", { entity: "sensor.p2_status", connection_badge: false }, { hass: p2("idle") }),
    offlineNoLink: addCard("unavailable, connection badge turned off", { connection_badge: false }, { hass: f2("unavailable") }),
  };

  // The progress edge
  const edges = {
    sweep: addCard("no progress sensor: sweep", {}, { hass: f2("processing") }),
    top: addCard("progress 42 on top, with percentage", { entity: "sensor.p2_status", progress_edge: { show_percentage: true } }, { hass: p2("processing") }),
    partial: addCard("from 10 to 90", { entity: "sensor.p2_status", progress_edge: { starts_at: 10, ends_at: 90 } }, { hass: p2("processing") }),
    around: addCard("around", { entity: "sensor.p2_status", progress_edge: { edge: "around" } }, { hass: p2("processing") }),
    left: addCard("left", { entity: "sensor.p2_status", progress_edge: { edge: "left", thickness: 6 } }, { hass: p2("processing") }),
    none: addCard("edge none", { entity: "sensor.p2_status", progress_edge: { edge: "none" } }, { hass: p2("processing") }),
    notWhile: addCard("not shown while idle", { entity: "sensor.p2_status" }, { hass: p2("idle") }),
    thresholds: addCard("thresholds", { entity: "sensor.p2_status", progress_edge: { color: "thresholds" } }, { hass: p2("processing") }),
  };

  // The xTool styles and features styles
  const styles = {
    f2UltraUv: addCard("f2_ultra_uv, match", { style: "f2_ultra_uv", features_style: "match", collapsible: false, ...jobFeatures }, { hass: f2("processing"), height: 220 }),
    timeFormat: addCard("camera time, card's Time format total", { style: "f2_ultra_uv", time_format: "total",
      features: [{ type: "custom:xtool-camera", show_last_updated: true }] }, { hass: f2("idle"), height: 360 }),
    samePattern: addCard("f2_ultra_uv, pattern 4242", { style: "f2_ultra_uv", features_style: "match", pattern: 4242, ...jobFeatures }, { hass: f2("processing"), height: 220 }),
    otherPattern: addCard("f2_ultra_uv, pattern 17", { style: "f2_ultra_uv", features_style: "match", pattern: 17, ...jobFeatures }, { hass: f2("processing"), height: 220 }),
    flat: addCard("f2_ultra_uv, flat", { style: "f2_ultra_uv", features_style: "flat", ...jobFeatures }, { hass: f2("processing"), height: 220 }),
    console: addCard("p2, console", { style: "p2", features_style: "console", features: [...jobFeatures.features, { type: "toggle" }] }, { hass: f2("processing"), height: 280 }),
    plain: addCard("no style", { ...jobFeatures }, { hass: f2("processing"), height: 220 }),
    titleOnly: addCard("f2_ultra_uv, title only", { style: "f2_ultra_uv" }, { hass: f2("processing"), height: 56 }),
  };

  // The space under the title, against Home Assistant's tile card fitted to
  // its content: in every style and features style, with the features below
  // the title or the first beside it, collapsible (rows: auto)
  const gapFeatures = [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }, { type: "custom:xtool-safety" }];
  const gapLooks = [["none", "console"], ["f2_ultra_uv", "match"], ["f2_ultra_uv", "flat"], ["f2_ultra_uv", "console"], ["p2", "match"], ["p2", "flat"], ["p2", "console"]];
  const gapCards = [];
  for (const position of ["bottom", "inline"]) {
    // Two rows below the title in either position
    const features = position === "inline" ? [...gapFeatures, { type: "custom:xtool-configuration" }, { type: "custom:xtool-focus" }] : gapFeatures;
    const tile = { features_position: position, features, show_entity_picture: true, state_content: ["state", "engraving_lens", "elapsed"] };
    const size = { hass: f2("idle"), height: "auto" };
    const core = addCoreTile(`core tile, ${position}`, tile, size);
    for (const [style, look] of gapLooks) {
      const card = addCard(`gap: ${style}, ${look}, ${position}`,
        { style, features_style: look, features_position: position, collapsible: true, features }, size);
      gapCards.push({ card, core, look: style === "none" ? "match" : look, name: `${style}, ${look}, ${position}` });
    }
  }

  // The defaults: Console, the first feature beside the title, the laser's own State content
  const defaultCard = addCard("defaults", { style: "p2", features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }] },
    { hass: f2("idle"), height: rowsHeight(2) });

  // Collapsing to the title
  try { localStorage.clear(); } catch (err) { /* no storage: the card still works */ }
  const collapsible = addCard("tap shows or hides the features", { style: "p2", collapsible: true, ...jobFeatures }, { hass: f2("idle"), height: 220 });
  const closedAtLoad = addCard("hidden at load", { entity: "sensor.p2_status", collapsible: true, expanded_at_load: false, ...jobFeatures }, { hass: p2("idle"), height: 220 });
  const closedInline = addCard("hidden at load, inline", { collapsible: true, expanded_at_load: false, features_position: "inline",
    features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }, { type: "custom:xtool-safety" }] }, { hass: f2("idle"), height: 160 });
  const autoCollapse = addCard("collapse when off", { entity: "sensor.p2_status", collapsible: true, ...jobFeatures }, { hass: p2("idle"), height: 220 });
  const keepOpen = addCard("collapse when off: off", { entity: "sensor.p2_status", collapsible: true, collapse_when_powered_off: false, ...jobFeatures }, { hass: p2("idle"), height: 220 });
  const noExpand = addCard("expand when powered on: off", { entity: "sensor.p2_status", collapsible: true, expand_when_powered_on: false, ...jobFeatures }, { hass: p2("idle"), height: 220 });
  const expandOnly = addCard("expand when powered on, collapse off", { entity: "sensor.p2_status", collapsible: true, collapse_when_powered_off: false, ...jobFeatures }, { hass: p2("idle"), height: 220 });
  const offAtLoad = addCard("off at load", { collapsible: true, ...jobFeatures }, { hass: f2("off"), height: 220 });
  const offStyled = addCard("off, p2", { style: "p2", ...jobFeatures }, { hass: f2("off"), height: 220 });
  const offOrange = addCard("off, f2_ultra_uv", { style: "f2_ultra_uv", ...jobFeatures }, { hass: f2("off"), height: 220 });
  const noLight = addCard("no status light", { status_light: false }, { hass: f2("idle"), height: 80 });
  // Collapsed, with the P2's controls beside the title
  const collapsedControls = addCard("collapsed, controls inline", { entity: "sensor.p2_status", collapsible: true, expanded_at_load: false, features_position: "inline",
    features: [{ type: "custom:xtool-controls" }, { type: "custom:xtool-job" }] }, { hass: p2("idle"), height: 120 });

  // A feature beside the title (features position: inline), and two columns of features
  const inlineCard = addCard("inline job, f2_ultra_uv", { style: "f2_ultra_uv", features_style: "console", features_position: "inline", collapsible: false,
    features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }, { type: "custom:xtool-safety" }] }, { hass: f2("idle"), height: 280 });
  const camera = addCard("camera", { features: [{ type: "custom:xtool-camera" }, { type: "custom:xtool-safetypro-if2-fan" }] }, { hass: f2("idle"), height: 120 });

  // The features below the title in Home Assistant's grid: the camera, and a last feature alone in its row
  const auto = (hass) => ({ hass, height: "auto" });
  const f2Max = {
    style: "f2_ultra_uv", features_style: "console", enabled_color: "purple", pattern: 4242, status_light: true,
    status_badge: ["alarm", "safety_key", "lid", "safety_checks", "firmware"],
    progress_edge: { edge: "top", thickness: 4, starts_at: 0, ends_at: 100, direction: "clockwise", color: "state", show_percentage: false, show_while: ["processing", "paused"] },
    collapsible: true, expanded_at_load: true, collapse_when_powered_off: true, expand_when_powered_on: true, last_feature_full_width: true,
    state_content: ["state", "engraving_lens", "elapsed"], features_position: "inline",
    features: [
      { type: "custom:xtool-job", controls: ["start_pause", "start", "pause", "cancel"], show: "icons", ask_before_cancelling: true },
      { type: "custom:xtool-controls", controls: ["power", "exhaust_fan", "fill_light_front", "fill_light_back", "red_dot", "autofocus"], show: "icons", animate_fan: true },
      { type: "custom:xtool-configuration", controls: ["buzzer", "if2_buzzer", "device_sleep"], show: "icons" },
      { type: "custom:xtool-safety", controls: ["flame_alarm", "stops_when_enclosure_opened", "stops_when_moved", "safety_key"], show: "icons", disabled_color: "red" },
      { type: "custom:xtool-lights", controls: ["fill_light_front", "fill_light_front_brightness", "fill_light_back", "fill_light_back_brightness"], off_at_minimum: false },
      { type: "custom:xtool-camera", camera: "main", camera_view: "auto", controls: ["camera_buttons", "camera_toggle", "custom_crop", "perspective"], show: "icons", show_last_updated: true, full_width: true },
      { type: "custom:xtool-safetypro-if2-fan", controls: ["fan_off", "fan_auto", "fan_speed"], show: "icons" },
      { type: "custom:xtool-focus", controls: ["autofocus", "focus_height"], show: "icons" },
    ],
  };
  const p2Max = {
    ...f2Max, entity: "sensor.p2_status", style: "p2", state_content: ["state", "elapsed"],
    features: [
      { type: "custom:xtool-controls", controls: ["power", "fill_light_close", "fill_light_left", "fill_light_right", "red_dot_close", "red_dot_quick", "safety_lock", "wake"], show: "icons", animate_fan: true },
      { type: "custom:xtool-configuration", controls: ["exhaust_fan", "buzzer"], show: "icons" },
      { type: "custom:xtool-safety", controls: ["flame_alarm", "lid", "baseplate"], show: "icons", disabled_color: "red" },
      { type: "custom:xtool-lights", controls: ["fill_light_left", "fill_light_left_brightness", "fill_light_right", "fill_light_right_brightness"], off_at_minimum: false },
      { type: "custom:xtool-camera", camera: "overview", camera_view: "auto", show: "icons", show_last_updated: true, full_width: true,
        controls: ["camera_buttons", "camera_toggle", "custom_crop", "thickness_or_distance", "measure_thickness_or_distance", "mode", "crop", "exposure", "fill_light_close", "fill_light_close_brightness"] },
      { type: "custom:xtool-overlays", show: "icons" },
      { type: "custom:xtool-position", controls: ["laser_position", "move_laser", "home_laser"], show: "icons" },
    ],
  };
  const halfCamera = (config) => ({ ...config, features: config.features.map((f) => (f.type === "custom:xtool-camera" ? { ...f, full_width: false } : f)) });
  const layouts = {
    f2Max: addCard("F2 Ultra UV, every option", f2Max, auto(f2("idle"))),
    f2Half: addCard("F2 Ultra UV, every option, camera in one column", halfCamera(f2Max), auto(f2("idle"))),
    p2Max: addCard("P2, every option", p2Max, auto(p2("idle"))),
    p2Half: addCard("P2, every option, camera in one column", halfCamera(p2Max), auto(p2("idle"))),
    odd: addCard("three below the title", { features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }, { type: "custom:xtool-safety" },
      { type: "custom:xtool-configuration" }] }, auto(f2("idle"))),
    oddHalf: addCard("three below the title, last feature in one column", { last_feature_full_width: false, features: [{ type: "custom:xtool-job" },
      { type: "custom:xtool-controls" }, { type: "custom:xtool-safety" }, { type: "custom:xtool-configuration" }] }, auto(f2("idle"))),
    oneHalf: addCard("one below the title, in one column", { last_feature_full_width: false, features: [{ type: "custom:xtool-job" },
      { type: "custom:xtool-controls" }] }, auto(f2("idle"))),
    oddBottom: addCard("bottom: one column", { features_position: "bottom", last_feature_full_width: false, features: [{ type: "custom:xtool-job" },
      { type: "custom:xtool-controls" }, { type: "custom:xtool-safety" }] }, auto(f2("idle"))),
  };
  // The smallest cards: the F2 Ultra UV's and the P2's, collapsible and not
  const minimum = {
    f2: addCard("F2 Ultra UV, minimum", { style: "f2_ultra_uv", features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }] }, auto(f2("idle"))),
    f2Fixed: addCard("F2 Ultra UV, minimum, not collapsible", { style: "f2_ultra_uv", collapsible: false,
      features: [{ type: "custom:xtool-job" }, { type: "custom:xtool-controls" }] }, auto(f2("idle"))),
    p2: addCard("P2, minimum", { entity: "sensor.p2_status", style: "p2", features: [{ type: "custom:xtool-controls" }] }, auto(p2("idle"))),
    p2Fixed: addCard("P2, minimum, not collapsible", { entity: "sensor.p2_status", style: "p2", collapsible: false,
      features: [{ type: "custom:xtool-controls" }] }, auto(p2("idle"))),
  };

  // Home Assistant's own features inside the card's, in Console: one channel each, fitted to the control
  const haInside = addCard("console, Home Assistant features inside", { style: "f2_ultra_uv", features_style: "console", features_position: "bottom",
    features: [{ type: "custom:xtool-lights", controls: ["fill_light_front", "fill_light_front_brightness"] }, { type: "custom:xtool-safetypro-if2-fan" }] }, { hass: f2("idle"), height: 200 });

  // State content attributes
  const content = addCard("state content", { state_content: ["state", "elapsed", "exhaust", "red_dot"] }, { hass: f2("processing") });
  const sensorContent = addCard("state content, sensors", { state_content: ["state", "engraving_lens", "wifi_signal", "firmware", "ip_address"] }, { hass: f2("idle") });

  // Galvo strokes never cross: parse "M x y L x y ..." and test every pair
  function crossings(d) {
    const pts = d.replace("M", "").split("L").map((p) => p.trim().split(/\s+/).map(Number));
    const side = (a, b, c) => (c[0] - a[0]) * (b[1] - a[1]) - (b[0] - a[0]) * (c[1] - a[1]);
    let n = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      for (let j = i + 2; j < pts.length - 1; j++) {
        const [p1, p2, p3, p4] = [pts[i], pts[i + 1], pts[j], pts[j + 1]];
        if ((side(p3, p4, p1) > 0) !== (side(p3, p4, p2) > 0) && (side(p1, p2, p3) > 0) !== (side(p1, p2, p4) > 0)) n++;
      }
    }
    return { n, count: pts.length };
  }

  runChecks(async () => {
    await wait(300);
    // Pictures
    const svg = Object.fromEntries(Object.entries(pictures).map(([k, card]) => [k, pictureOf(card)]));
    for (const [k, s] of Object.entries(svg)) check(k, s.startsWith("<svg"), "a state picture replaces the icon");
    check("idle", svg.idle.includes('r="8.5"') && svg.idle.includes('class="b"'), "the laser dot with a breathing halo");
    check("F2 processing", svg.galvo.includes("#9b7bff") && svg.galvo.includes('class="h"'), "a violet (UV) trail with a moving head");
    const galvoD = (svg.galvo.match(/d="(M[^"]+)"/) ?? [])[1] ?? "";
    const { n, count } = crossings(galvoD);
    check("F2 processing", n === 0 && count >= 8, `the galvo strokes never cross (${count} points, ${n} crossings)`);
    check("P2 processing", svg.raster.includes("#ff7043") && svg.raster.includes("M3.5 4 H20.5") && svg.raster.includes('class="h s"'),
      "an orange-red (CO2) raster, drawn slower");
    check("paused", svg.paused.includes("M8.5 4.5v15M15.5 4.5v15") && svg.paused.includes('class="e"'), "pause bars burned in, with an ember");
    check("finished", svg.finished.includes("M3.8 12.8") && svg.finished.includes("#3fbf6a"), "a green check burned in");
    check("sleeping", (svg.sleeping.match(/class="z/g) ?? []).length === 3, "three drifting Zs");
    check("framing", svg.framing.includes('class="f"'), "a dash tracing the outline");
    check("fire warning", svg.fire.includes('class="k"') && svg.fire.includes("#ff3d00"), "a flickering flame");
    check("off", svg.off.includes("M12 2.5v9"), "the power symbol");
    check("error", svg.error.includes("M12 2.5 22.5 21H1.5z"), "a warning triangle");

    // Badges
    const badge = (card) => card.shadowRoot.querySelector(".badge.status");
    const on = (card) => badge(card).classList.contains("on");
    check("no badge", !on(badges.none), "no badge when all is well");
    check("safety key out", on(badges.key) && badge(badges.key).title === "Safety key removed", "the safety key badge");
    check("a safety check off", on(badges.safetyOff) && badge(badges.safetyOff).title === "A safety check is off", "the safety check badge");
    const link = (card) => card.shadowRoot.querySelector(".badge.connection");
    const linkOn = (card) => link(card).classList.contains("on");
    check("unavailable", !on(badges.offline) && linkOn(badges.offline) && link(badges.offline).title === "Unavailable",
      "a Status entity that is unavailable: the connection badge says so, not the status badge");
    check("connection", !linkOn(badges.none), "the F2 has no Connection sensor: no connection badge while it is available");
    check("connection", on(badges.ethernet) && linkOn(badges.ethernet) && link(badges.ethernet).title === "Connection: ethernet"
      && link(badges.ethernet).style.background.includes("--xtool-enabled-color"), "the P2 on Ethernet, in the enabled color, beside the lid badge");
    check("connection", link(badges.wifi).title === "Connection: wifi", "the P2 on Wi-Fi");
    check("connection", !linkOn(badges.noLink) && !linkOn(badges.offlineNoLink) && !on(badges.offlineNoLink), "turned off: no connection badge, even while unavailable");
    {
      const top = badge(badges.ethernet).getBoundingClientRect(), bottom = link(badges.ethernet).getBoundingClientRect();
      check("connection", Math.abs(top.left - bottom.left) < 0.5 && Math.abs(top.width - bottom.width) < 0.5 && bottom.top > top.bottom,
        `the same size, straight below the status badge (${top.left},${top.top} and ${bottom.left},${bottom.top})`);
    }
    check("badges turned off", !on(badges.chosen), "no badge when none are chosen");
    check("P2 lid open", on(badges.lid) && badge(badges.lid).title === "Lid open", "the lid badge");
    check("badge order", badge(badges.alarmFirst).title === "Alarm", "alarm listed first: the alarm shows");
    check("badge order", badge(badges.keyFirst).title === "Safety key removed", "safety key listed first: the safety key shows, though the alarm is also on");
    check("badge order", badge(badges.firstApplies).title === "Safety key removed", "the first listed that applies shows");
    check("fire warning", on(pictures.fire) && badge(pictures.fire).title === "Fire warning", "the fire badge comes first");
    const icon = badges.key.shadowRoot.querySelector("hui-tile-card").shadowRoot.querySelector("ha-tile-icon").getBoundingClientRect();
    const b = badge(badges.key).getBoundingClientRect();
    check("safety key out", Math.abs(b.left + b.width / 2 - (icon.left + icon.width * (.5 + .5 * 16.7 / 20 * .7071))) < 1, "the badge sits tucked in from the picture's edge");

    // Progress edge
    const edge = (card) => card.shadowRoot.getElementById("edge");
    check("no progress sensor: sweep", edge(edges.sweep).classList.contains("indeterminate"), "the edge sweeps without a progress sensor");
    check("progress 42 on top", edge(edges.top).style.background.includes("42%") && edge(edges.top).style.top === "0px",
      "the top edge fills to 42%");
    check("progress 42 on top", edges.top.shadowRoot.getElementById("pct").textContent === "42%", "the percentage is shown");
    check("from 10 to 90", edge(edges.partial).style.background.includes("43.6%"), "the fill runs from 10% to 90% of the edge");
    check("around", edge(edges.around).classList.contains("around") && edge(edges.around).style.background.includes("conic-gradient"),
      "the edge runs around the card");
    check("left", edge(edges.left).style.width === "6px" && edge(edges.left).style.left === "0px", "the left edge, 6 px thick");
    check("edge none", !edge(edges.none).classList.contains("on"), "no edge");
    check("not shown while idle", !edge(edges.notWhile).classList.contains("on"), "no edge while idle");
    check("thresholds", edge(edges.thresholds).style.background.includes("--warning-color"), "42% is in the attention color");

    const inner = (card) => card.shadowRoot.querySelector("hui-tile-card");

    // The defaults
    check("defaults", inner(defaultCard).config.features_position === "inline" && inner(defaultCard).config.state_content.join() === "state,engraving_lens,elapsed",
      `features beside the title; State content: the state, the engraving lens and the time it has run (${inner(defaultCard).config.state_content.join(", ")})`);
    check("defaults", inner(pictures.raster).config.state_content.join() === "state,elapsed", "a laser without an engraving lens sensor: the state and the time it has run");
    check("defaults", defaultCard.shadowRoot.querySelectorAll(".area.console").length > 0 && deep(defaultCard, "xtool-job")[0]?.hasAttribute("xtool-console"),
      "features style: Console");

    // Styles
    const frame = (card) => card.shadowRoot.querySelector(".frame");
    const windowBox = (card) => card.shadowRoot.getElementById("window");
    check("f2_ultra_uv, match", frame(styles.f2UltraUv).classList.contains("styled") && frame(styles.f2UltraUv).classList.contains("f2_ultra_uv"),
      "the F2 Ultra UV style is drawn");
    const wh = parseFloat(windowBox(styles.f2UltraUv).style.height), fh = frame(styles.f2UltraUv).offsetHeight;
    const collapsedHeight = parseFloat(windowBox(styles.titleOnly).style.height);
    check("f2_ultra_uv, match", Math.abs(wh - collapsedHeight) < 0.5 && Math.abs(wh - 48) < 0.5,
      `expanded, the window keeps its collapsed height, one row less its 4 px margins (${wh} and ${collapsedHeight} px)`);
    check("f2_ultra_uv, match", wh > 30 && wh < fh / 2, `the window covers the title only (${Math.round(wh)} of ${fh} px)`);

    // The space from the bottom of the title's text to the first feature below, as on Home Assistant's tile card
    const textToFeature = (tile) => {
      const text = tile.shadowRoot.querySelector("ha-tile-info .secondary").getBoundingClientRect();
      const group = tile.shadowRoot.querySelector('hui-card-features[slot="features"]');
      return group.shadowRoot.querySelector("hui-card-feature").getBoundingClientRect().top - text.bottom;
    };
    // What shows of each control below the title: its patch or channel, or the control itself in Match
    const shapesBelow = (card, top) => {
      const areas = [...card.shadowRoot.querySelectorAll(".area")].map((a) => a.getBoundingClientRect());
      const items = deep(inner(card).shadowRoot.querySelector('hui-card-features[slot="features"]'), ".key, .field, .slide:not([hidden]), ha-tile-icon")
        .map((el) => el.getBoundingClientRect()).filter((r) => r.width);
      return (areas.length ? areas : items).filter((r) => r.top > top - 1);
    };
    for (const { card, core, name, look } of gapCards) {
      const ours = textToFeature(inner(card)), theirs = textToFeature(core);
      const pad = { match: 0, flat: 2, console: 3 }[look], margin = card._config.style === "none" ? 0 : 4;
      check(`gap: ${name}`, Math.abs(ours - theirs - (12 - margin - pad)) < 0.5,
        `the title's text to the first feature below: ${Math.round(ours)} px, the tile card's (${Math.round(theirs)} px) and the feature gap less the window's margin and the channel's pad`);
      if (card._config.style === "none") continue;
      // From the window's bottom edge to the first row of shapes, as from one row of them to the next
      const winBottom = windowBox(card).getBoundingClientRect().bottom;
      const shapes = shapesBelow(card, winBottom);
      // The first row: the shapes that start with the highest; the second: those below all of them.
      // A pressed Console key sits 1 px lower, so each row is measured where its keys rest (the highest)
      const firstTop = Math.min(...shapes.map((r) => r.top));
      const first = shapes.filter((r) => r.top < firstTop + 4);
      const firstBottom = Math.min(...first.map((r) => r.bottom));
      const second = shapes.filter((r) => r.top >= firstBottom + 2);
      const under = firstTop - winBottom;
      const between = Math.min(...second.map((r) => r.top)) - firstBottom;
      check(`gap: ${name}`, second.length > 0 && Math.abs(under - between) < 0.5,
        `under the window as between rows: ${under.toFixed(1)} and ${between.toFixed(1)} px`);
      // The window is one row, centered on the icon, however tall the cell
      const win = windowBox(card).getBoundingClientRect(), icon = inner(card).shadowRoot.querySelector("ha-tile-icon").getBoundingClientRect();
      check(`gap: ${name}`, Math.abs(win.height - 48) < 0.5 && Math.abs((win.top + win.bottom) / 2 - (icon.top + icon.bottom) / 2) < 0.5,
        `the window is one row, centered on the icon (${Math.round(win.height)} px)`);
    }
    check("f2_ultra_uv, match", styles.f2UltraUv.shadowRoot.querySelectorAll(".area").length === 0, "Match draws no areas");
    await wait(100);
    const timedCamera = deep(styles.timeFormat, "xtool-camera")[0];
    timedCamera?.shadowRoot.querySelector("hui-image")?.shadowRoot.querySelector("img").dispatchEvent(new Event("load"));
    check("camera time", timedCamera?.shadowRoot.querySelector(".time hui-timestamp-display")?.format === "total", "the camera's time follows the card's Time format");
    const gloss = (card) => windowBox(card).style.getPropertyValue("--xtool-gloss");
    check("reflections", (gloss(styles.f2UltraUv).match(/linear-gradient/g) ?? []).length >= 3, "the window has a sheen and reflections");
    check("reflections", gloss(styles.f2UltraUv) === gloss(styles.samePattern), "the default pattern is 4242: the same reflections");
    check("reflections", gloss(styles.otherPattern) !== gloss(styles.f2UltraUv), "another pattern gives other reflections");
    const keys = deep(styles.flat, ".key").filter((key) => key.offsetWidth).length;
    check("f2_ultra_uv, flat", keys > 0 && styles.flat.shadowRoot.querySelectorAll(".area.flat").length === keys,
      `a flat patch behind each button shown (${keys})`);
    check("f2_ultra_uv, flat", styles.flat.shadowRoot.querySelector("hui-tile-card").classList.contains("solid"), "the buttons get a solid backing");
    check("p2, console", deep(styles.console, "xtool-job, xtool-controls").every((el) => el.hasAttribute("xtool-console")),
      "the buttons are keys");
    check("p2, console", deep(styles.console, "ha-control-switch").every((el) => el.hasAttribute("xtool-slide")), "the toggle is a slide");
    check("p2, console", !styles.console.shadowRoot.getElementById("stripe"), "no line below the title row");
    check("no style", !frame(styles.plain).classList.contains("styled"), "no style: the theme's card");

    // Collapsing
    check("tap shows or hides the features", inner(collapsible).config.tap_action?.action === "fire-dom-event" && inner(collapsible).config.features.length === 2,
      "a tap on the card toggles the features, which show at first");
    const tap = () => inner(collapsible).shadowRoot.querySelector("ha-card").dispatchEvent(new CustomEvent("ll-custom", {
      bubbles: true, composed: true, detail: inner(collapsible).config.tap_action,
    }));
    tap();
    await wait(50);
    check("tap shows or hides the features", inner(collapsible).config.features.length === 0, "a tap hides them");
    check("tap shows or hides the features", localStorage.getItem("xtool-card:sensor.f2_status") === "0", "the browser remembers it");
    tap();
    await wait(50);
    // A tap between the features (it reaches the card behind them) leaves them open
    const featureArea = inner(collapsible).shadowRoot.querySelector('hui-card-features[slot="features"]').getBoundingClientRect();
    collapsible.shadowRoot.querySelector(".frame").dispatchEvent(new PointerEvent("pointerdown", {
      bubbles: true, composed: true, clientX: featureArea.left + 2, clientY: featureArea.top + 2,
    }));
    tap();
    await wait(50);
    check("tap shows or hides the features", inner(collapsible).config.features.length === 2, "a tap between the features leaves them open");
    const title = inner(collapsible).shadowRoot.querySelector("ha-tile-icon").getBoundingClientRect();
    collapsible.shadowRoot.querySelector(".frame").dispatchEvent(new PointerEvent("pointerdown", {
      bubbles: true, composed: true, clientX: title.left + 2, clientY: title.top + 2,
    }));
    tap();
    await wait(50);
    check("tap shows or hides the features", inner(collapsible).config.features.length === 0, "a tap on the title row hides them");
    tap();
    await wait(50);
    check("tap shows or hides the features", inner(collapsible).config.features.length === 2, "another tap shows them again");
    check("hidden at load", inner(closedAtLoad).config.features.length === 0, "Expanded at load: off");

    // Collapsed: only the title row, its feature's keys in one line
    const inlineRow = deep(collapsedControls, "xtool-controls")[0]?.shadowRoot.querySelector(".row");
    const inlineKeys = [...(inlineRow?.querySelectorAll(".key") ?? [])].filter((k) => k.offsetWidth).map((k) => k.getBoundingClientRect());
    check("collapsed, controls inline", inner(collapsedControls).config.features.length === 1 && inlineKeys.length >= 4
      && new Set(inlineKeys.map((b) => Math.round(b.top))).size === 1 && inlineKeys.at(-1).right <= inlineRow.getBoundingClientRect().right + 1,
      `the feature beside the title keeps its ${inlineKeys.length} keys in one line, so the card is one row tall`);

    // The editor's preview: expanded when the editor opens, then only a tap changes it
    try { localStorage.setItem("xtool-card:sensor.f2_status", "0"); } catch (err) { /* no storage */ }
    document.createElement("xtool-card-editor");
    const previewConfig = { type: "custom:xtool-card", entity: "sensor.f2_status", collapsible: true, expanded_at_load: false, ...jobFeatures };
    const preview = document.createElement("xtool-card");
    preview.setConfig(previewConfig);
    preview.hass = f2("off");
    preview.preview = true;
    document.getElementById("cards").append(preview);
    await wait(50);
    check("editor preview", inner(preview).config.features.length === 2, "expanded when the editor opens, though collapsed at load, off and remembered collapsed");
    preview.setConfig({ ...previewConfig, features: [...jobFeatures.features, { type: "custom:xtool-safety" }] });
    preview.hass = f2("idle");
    preview.hass = f2("off");
    await wait(50);
    check("editor preview", inner(preview).config.features.length === 3, "adding a feature, or the laser turning off, leaves it expanded");
    inner(preview).shadowRoot.querySelector("ha-card").dispatchEvent(new CustomEvent("ll-custom", { bubbles: true, composed: true, detail: inner(preview).config.tap_action }));
    await wait(50);
    preview.setConfig({ ...previewConfig, style: "p2" });
    await wait(50);
    check("editor preview", inner(preview).config.features.length === 0 && localStorage.getItem("xtool-card:sensor.f2_status") === "0",
      "a tap collapses it, and another change keeps it collapsed; the dashboard's remembered state is not touched");
    const rebuilt = document.createElement("xtool-card");
    rebuilt.setConfig({ ...previewConfig, style: "p2" });
    rebuilt.hass = f2("idle");
    rebuilt.preview = true;
    document.getElementById("cards").append(rebuilt);
    await wait(50);
    check("editor preview", inner(rebuilt).config.features.length === 0, "a preview card made anew for a change keeps what was shown");
    document.createElement("xtool-card-editor");
    const reopened = document.createElement("xtool-card");
    reopened.setConfig(previewConfig);
    reopened.hass = f2("idle");
    reopened.preview = true;
    document.getElementById("cards").append(reopened);
    await wait(50);
    check("editor preview", inner(reopened).config.features.length === 2, "the editor opened again starts expanded");
    preview.remove();
    rebuilt.remove();
    reopened.remove();

    // Collapse when off: closes as the machine turns off, opens as it turns on
    autoCollapse.hass = p2("unavailable");
    keepOpen.hass = p2("unavailable");
    await wait(50);
    check("collapse when off", inner(autoCollapse).config.features.length === 0, "turning off collapses the card");
    check("collapse when off", localStorage.getItem("xtool-card:sensor.p2_status") !== "0", "the browser keeps the tapped choice");
    check("collapse when off: off", inner(keepOpen).config.features.length === 2, "with the option off, the card stays open");
    autoCollapse.hass = p2("idle");
    await wait(50);
    check("collapse when off", inner(autoCollapse).config.features.length === 2, "turning on expands it again");
    // Expand when powered on: off, the card stays collapsed as the machine turns on
    noExpand.hass = p2("unavailable");
    await wait(50);
    noExpand.hass = p2("idle");
    await wait(50);
    check("expand when powered on: off", inner(noExpand).config.features.length === 0, "with Expand when powered on off, the card stays collapsed");
    // Collapse off, Expand on: a card collapsed by a tap expands as the machine turns on
    const tapCard = (card) => inner(card).shadowRoot.querySelector("ha-card").dispatchEvent(new CustomEvent("ll-custom", {
      bubbles: true, composed: true, detail: inner(card).config.tap_action,
    }));
    tapCard(expandOnly);
    await wait(30);
    expandOnly.hass = p2("unavailable");
    await wait(50);
    check("expand when powered on, collapse off", inner(expandOnly).config.features.length === 0, "a card collapsed by a tap stays collapsed as the machine turns off");
    expandOnly.hass = p2("idle");
    await wait(50);
    check("expand when powered on, collapse off", inner(expandOnly).config.features.length === 2, "and expands as it turns on");
    // A tap while the machine is off: Expand when powered on still expands it as it turns on
    autoCollapse.hass = p2("unavailable");
    await wait(50);
    tapCard(autoCollapse);
    await wait(30);
    tapCard(autoCollapse);
    await wait(30);
    autoCollapse.hass = p2("idle");
    await wait(50);
    check("collapse when off", inner(autoCollapse).config.features.length === 2, "tapped while the machine was off, it still expands as it turns on");
    check("off at load", inner(offAtLoad).config.features.length === 0, "a card that loads while the machine is off is collapsed");
    const tapOff = () => inner(offAtLoad).shadowRoot.querySelector("ha-card").dispatchEvent(new CustomEvent("ll-custom", {
      bubbles: true, composed: true, detail: inner(offAtLoad).config.tap_action,
    }));
    tapOff();
    await wait(50);
    check("off at load", inner(offAtLoad).config.features.length === 2, "a tap still opens it while off");
    offAtLoad.hass = f2("idle");
    await wait(50);
    offAtLoad.hass = f2("off");
    await wait(50);
    check("off at load", inner(offAtLoad).config.features.length === 0, "turning off again collapses it");
    check("hidden at load, inline", inner(closedInline).config.features.map((f) => f.type).join() === "custom:xtool-job",
      "collapsed, the feature beside the title stays, as on a tile card");
    check("f2_ultra_uv, match", !inner(styles.f2UltraUv).config.tap_action, "with Collapsible off, the Tap behavior is the card's own");
    check("defaults", inner(defaultCard).config.tap_action?.action === "fire-dom-event", "Collapsible is on by default: a tap shows or hides the features");

    // When off, only the window darkens
    const offFrame = frame(offStyled);
    check("off, p2", offFrame.classList.contains("off") && getComputedStyle(offStyled.shadowRoot.getElementById("window")).filter.includes("brightness"),
      "the window darkens");
    check("off, p2", getComputedStyle(offStyled.shadowRoot.getElementById("body")).filter === "none" && getComputedStyle(offFrame).opacity === "1",
      "the body and the card do not");
    check("off, p2", !frame(styles.f2UltraUv).classList.contains("off"), "a machine that is on is not darkened");
    // Dimmed a little, the same in every style: the F2 Ultra UV's window still reads orange, not brown
    const dimOf = (card) => getComputedStyle(card.shadowRoot.getElementById("window")).filter;
    const orange = [0xf5, 0xa2, 0x1a].map((c) => c * 0.8);
    const grey = orange.reduce((a, b) => a + b) / 3;
    const dimmed = orange.map((c) => grey + (c - grey) * 0.9);
    check("off, f2_ultra_uv", dimOf(offOrange) === "brightness(0.8) saturate(0.9)" && dimOf(offOrange) === dimOf(offStyled)
      && dimmed[0] > 180 && dimmed[0] - dimmed[2] > 150,
      `the window dims only slightly, as in the other style (${dimOf(offOrange)}: the top of the glass ${dimmed.map(Math.round).join(", ")})`);

    // No dividers between features side by side
    check("no style", getComputedStyle(inner(styles.plain)).getPropertyValue("--ha-card-feature-divider").trim() === "none",
      "the theme's feature divider is turned off");

    // The window covers the header row, with room for the controls beside the title
    const tileRoot = inner(inlineCard).shadowRoot;
    const win = inlineCard.shadowRoot.getElementById("window").getBoundingClientRect();
    // The feature beside the title (its group is as tall as the title row)
    const beside = tileRoot.querySelector('hui-card-features[slot="features-inline"]').shadowRoot.querySelector("hui-card-feature").getBoundingClientRect();
    const below = tileRoot.querySelector('hui-card-features[slot="features"]').getBoundingClientRect();
    check("inline job", win.bottom >= beside.bottom + 5 && win.top <= beside.top - 3, `the window holds the feature beside the title (window ${Math.round(win.top)} to ${Math.round(win.bottom)}, feature ${Math.round(beside.top)} to ${Math.round(beside.bottom)})`);
    check("inline job", win.bottom <= below.top, "the features below sit on the body");
    check("inline job", win.right - beside.right >= 5, `room at the right (${Math.round(win.right - beside.right)} px)`);

    // No divider before a feature in a second column
    const group = tileRoot.querySelector('hui-card-features[slot="features"]');
    const second = group.shadowRoot.querySelector(".divided");
    check("inline job", !!second && getComputedStyle(second).borderInlineStartStyle === "none", "the divider is gone from the second column");
    check("inline job", group.shadowRoot.adoptedStyleSheets.length === 1, "removed from the feature group, once");

    // The card's height follows its content, in every case
    const sized = [inlineCard, camera, collapsible, defaultCard, ...Object.values(layouts), ...Object.values(minimum)];
    check("grid", sized.every((card) => card.getGridOptions().rows === "auto" && !("min_rows" in card.getGridOptions())),
      `rows: auto for every card, with no fixed minimum (${sized.map((card) => card.getGridOptions().rows).join(", ")})`);
    check("grid", inlineCard.getGridOptions().columns === inner(inlineCard).getGridOptions().columns, "the tile card's columns");

    // The title row is as tall on every card: no spare height above the title
    const titleRow = (card) => inner(card).shadowRoot.querySelector("ha-tile-container").shadowRoot.querySelector(".content").getBoundingClientRect().height;
    const titled = [...Object.values(minimum), layouts.f2Max, layouts.p2Max, layouts.odd];
    check("header", titled.every((card) => Math.abs(titleRow(card) - titleRow(minimum.f2)) < 0.5)
      && Math.abs(parseFloat(windowBox(minimum.f2Fixed).style.height) - parseFloat(windowBox(minimum.f2).style.height)) < 0.5,
      `a minimum card that is not collapsible has the same title row as the others (${titled.map((card) => Math.round(titleRow(card))).join(", ")} px)`);

    // Where the features below the title sit
    const placesOf = (card) => {
      const group = deep(card, 'hui-card-features[slot="features"]')[0];
      const css = getComputedStyle(group);
      const start = group.getBoundingClientRect().left + parseFloat(css.paddingLeft);
      const width = group.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight);
      const half = (width - parseFloat(css.columnGap)) / 2;
      return [...group.shadowRoot.querySelectorAll("hui-card-feature")].map((item) => {
        const b = item.getBoundingClientRect();
        return { type: item.feature.type.replace("custom:xtool-", ""), left: b.left - start, top: b.top, bottom: b.bottom, width: b.width,
          full: Math.abs(b.width - width) < 1, half: Math.abs(b.width - half) < 1, right: b.left - start > half / 2 };
      });
    };
    const describe = (places) => places.map((p) => `${p.type}:${p.full ? "full" : p.right ? "right" : "left"}`).join(" ");
    const overlap = (places) => places.some((a, i) => places.some((b, j) => j > i && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5
      && (a.full || b.full || a.right === b.right)));
    // The camera, the features beside it (in the other column, from its top), and the ones after
    const besideCamera = (places) => {
      const cam = places.find((p) => p.type === "camera");
      const beside = places.filter((p) => p !== cam && !p.full && p.right !== cam.right && p.top < cam.bottom - 0.5 && p.bottom > cam.top + 0.5);
      const after = places.slice(places.indexOf(cam) + 1).filter((p) => !beside.includes(p));
      return { cam, beside, after };
    };
    await wait(400);
    check("enabled color", layouts.f2Max.style.getPropertyValue("--xtool-enabled-color") === "var(--purple-color)"
      && !layouts.odd.style.getPropertyValue("--xtool-enabled-color"),
      "Enabled color: given to every feature in the card; without it, the features use the theme's Info color");
    // Home Assistant sends a new hass for every change of any entity: only this laser's reach the tile
    {
      const card = layouts.p2Max, tile = card.shadowRoot.querySelector("hui-tile-card");
      const shown = tile.hass, base = card.hass;
      const other = { ...base, states: { ...base.states, "sensor.elsewhere": { entity_id: "sensor.elsewhere", state: "1", attributes: {} } } };
      card.hass = other;
      check("updates", tile.hass === shown, "another entity's change: the tile keeps the hass it has (nothing it shows changed)");
      const own = { ...other, states: { ...other.states, "switch.p2_buzzer": { ...other.states["switch.p2_buzzer"], state: "on" } } };
      card.hass = own;
      const inner = tile.hass.states;
      check("updates", tile.hass !== shown && inner["switch.p2_buzzer"].state === "on" && inner["sensor.p2_status"].attributes.entity_picture
        && Object.keys(inner).length === Object.keys(own.states).length && inner["sensor.elsewhere"] === own.states["sensor.elsewhere"],
        "the laser's own change: a new hass, whose states read through to Home Assistant's (none copied), with the state picture on the laser's entity");
      card.hass = own;
      check("updates", tile.hass.states === inner, "the same hass again: the same states");
      card.hass = base;
    }
    for (const [name, card] of [["F2 Ultra UV", layouts.f2Max], ["P2", layouts.p2Max]]) {
      const places = placesOf(card);
      const cam = places.find((p) => p.type === "camera");
      check("layout, camera full width", cam?.full && !overlap(places) && places.every((p) => p.full || p.half),
        `${name}, every option: the camera takes both columns; the others half each, side by side, none overlapping (${describe(places)})`);
    }
    // Core's pattern around a camera across the card: a feature left alone before it takes the full width too
    const p2Places = placesOf(layouts.p2Max);
    check("layout, camera full width", describe(p2Places) === "configuration:left safety:right lights:full camera:full overlays:left position:right",
      `P2: the lights, left alone before the camera, take the full width (${describe(p2Places)})`);
    check("layout, camera full width", describe(placesOf(layouts.f2Max))
      === "controls:left configuration:right safety:left lights:right camera:full safetypro-if2-fan:left focus:right",
      `F2 Ultra UV: left and right in the order chosen (${describe(placesOf(layouts.f2Max))})`);
    for (const [name, card] of [["F2 Ultra UV", layouts.f2Half], ["P2", layouts.p2Half]]) {
      const places = placesOf(card);
      const { cam, beside, after } = besideCamera(places);
      const rowGap = parseFloat(getComputedStyle(deep(card, 'hui-card-features[slot="features"]')[0]).rowGap);
      const stacked = beside.every((p, i) => i === 0 || Math.abs(p.top - beside[i - 1].bottom - rowGap) < 0.5);
      const reached = beside.length > 0 && (beside.at(-1).bottom >= cam.bottom - 0.5 || after.length === 0);
      const justEnough = beside.length < 2 || beside.at(-2).bottom < cam.bottom - 0.5;
      check("layout, camera in one column", cam.half && beside.length > 0 && Math.abs(beside[0].top - cam.top) < 0.5 && stacked && reached && justEnough && !overlap(places),
        `${name}: the camera in one column; the features after it beside it, one per row, until they pass the bottom of the picture (${describe(places)}; picture ${Math.round(cam.top)} to ${Math.round(cam.bottom)}, beside ${beside.map((p) => `${Math.round(p.top)} to ${Math.round(p.bottom)}`).join(", ")})`);
      check("layout, camera in one column", after.every((p, i) => (p.full ? i === after.length - 1 : p.half && p.right === (i % 2 === 1))) && !overlap(places),
        `${name}: then left and right again (${describe(after)})`);
    }
    // The rule on its own: a picture 100 px tall, features 42 px tall, a 12 px row gap
    const rule = featurePlaces([{ camera: true, full: false, height: 100 }, ...Array(6).fill({ camera: false, full: false, height: 42 })], 12, true);
    check("layout, camera in one column", JSON.stringify(rule.places.map((p) => `${p.column}@${p.row}`)) === JSON.stringify(["1@1 / span 3", "2@1", "2@2", "2@3", "1@4", "2@4", "1 / -1@5"])
      && rule.rows.join(" ") === "auto auto 1fr auto auto",
      `beside the picture until the features pass its bottom (42, 96, then 150 px), then left and right again, the last alone across (${rule.places.map((p) => `${p.column}@${p.row}`).join("; ")}; rows ${rule.rows.join(" ")})`);
    const ruleRight = featurePlaces([{ camera: false, full: false, height: 42 }, { camera: true, full: false, height: 50 },
      { camera: false, full: false, height: 42 }, { camera: false, full: false, height: 42 }], 12, false);
    check("layout, camera in one column", ruleRight.places.map((p) => `${p.column}@${p.row}`).join("; ") === "1@1; 2@1 / span 2; 1@2; 1@3",
      `a camera on the right: the feature left of it is the first beside it; one column for the last, without Last feature full width (${ruleRight.places.map((p) => `${p.column}@${p.row}`).join("; ")})`);
    const ruleFull = featurePlaces([{ camera: false, full: false, height: 42 }, { camera: true, full: true, height: 200 }, { camera: false, full: false, height: 42 }], 12, true);
    check("layout, camera full width", ruleFull.places.map((p) => `${p.column}@${p.row}`).join("; ") === "1 / -1@1; 1 / -1@2; 1 / -1@3" && ruleFull.rows.join(" ") === "auto auto auto",
      `a full-width camera: a feature alone before it, and the last, across too (${ruleFull.places.map((p) => `${p.column}@${p.row}`).join("; ")})`);

    // A last feature alone in its row
    check("layout, last feature", describe(placesOf(layouts.odd)) === "controls:left safety:right configuration:full",
      `with Last feature full width (the default), it takes both columns (${describe(placesOf(layouts.odd))})`);
    check("layout, last feature", describe(placesOf(layouts.oddHalf)) === "controls:left safety:right configuration:left" && placesOf(layouts.oddHalf).every((p) => p.half),
      `without it, one column (${describe(placesOf(layouts.oddHalf))})`);
    check("layout, last feature", placesOf(layouts.oneHalf).length === 1 && placesOf(layouts.oneHalf)[0].half && !placesOf(layouts.oneHalf)[0].right,
      "one feature below the title, without it: one column too");
    const itemsOf = (card) => [...deep(card, 'hui-card-features[slot="features"]')[0].shadowRoot.querySelectorAll("hui-card-feature")];
    const columnsOf = (card) => itemsOf(card).map((item) => getComputedStyle(item).getPropertyValue("--feature-columns").trim());
    check("layout, last feature", columnsOf(layouts.odd).join() === "2,2,1" && columnsOf(layouts.oddHalf).join() === "2,2,2",
      `each feature told how many columns share the row, as Home Assistant tells it (${columnsOf(layouts.odd).join()}; ${columnsOf(layouts.oddHalf).join()})`);
    check("layout, bottom", placesOf(layouts.oddBottom).every((p) => p.full) && !itemsOf(layouts.oddBottom).some((item) => item.style.gridRow),
      "features at the bottom: Home Assistant's one column, as it is");
    check("layout, core", !itemsOf(layouts.odd).some((item) => item.style.gridRow || item.style.gridColumn),
      "without a camera and with the defaults, Home Assistant's grid is left as it is");
    check("grid", camera.getCardSize() === 7, `the camera counts as five rows (${camera.getCardSize()})`);

    // One channel for each Home Assistant control inside the card's features
    const channels = [...haInside.shadowRoot.querySelectorAll(".area.console")];
    check("console, Home Assistant features inside", channels.length === 5,
      `one channel each: the light's icon and slider, and each of the IF2 fan's three buttons (${channels.length})`);
    check("console, Home Assistant features inside", channels.every((a) => Math.abs(parseFloat(a.style.height) - 48) <= 1),
      `fitted to the 42 px controls, the light's icon as tall as its row (${channels.map((a) => a.style.height).join(", ")})`);

    // State content
    const info = content.shadowRoot.querySelector("hui-tile-card").shadowRoot.querySelector("ha-tile-info .secondary").textContent;
    check("state content", /processing · 12:[0-5]\d · Exhaust running · Red dot off/.test(info), `elapsed time and parts (${info})`);
    const sensorTile = sensorContent.shadowRoot.querySelector("hui-tile-card");
    const sensorInfo = sensorTile.shadowRoot.querySelector("ha-tile-info .secondary").textContent;
    check("state content, sensors", sensorInfo === "idle · big · -52 dBm · 40.130.023.00.ht5",
      `the laser's sensors, the chosen diagnostics, and the firmware version; no other diagnostics (${sensorInfo})`);
    const sensorAttributes = sensorTile.hass.states["sensor.f2_status"].attributes;
    check("state content, sensors", !("machine_lock" in sensorAttributes) && !("status" in sensorAttributes) && sensorAttributes.task_time === "1132",
      "the other sensors too; parts the card already reports and the card's own entity are not repeated");
    const request = new Event("context-request", { bubbles: true, composed: true });
    let fromContext;
    Object.assign(request, { context: "states", subscribe: true, callback: (states) => (fromContext = states) });
    sensorTile.dispatchEvent(request);
    check("state content, sensors", fromContext?.["sensor.f2_status"]?.attributes.engraving_lens === "big",
      "the states context inside the card has the card's attributes");
    const finishedInfo = pictures.finished.shadowRoot.querySelector("hui-tile-card").shadowRoot.querySelector("ha-tile-info .secondary").textContent;
    check("finished", finishedInfo === "finished · 18:52", `the last job's time (${finishedInfo})`);

    // The machine's status light, as a ring around the picture (the F2 Ultra UV: white)
    const tileOf = (card) => card.shadowRoot.querySelector("hui-tile-card");
    check("status light", tileOf(content).getAttribute("xtool-light") === "slow" && tileOf(content).style.getPropertyValue("--xtool-light") === "#ffffff",
      "white, blinking slowly while it works");
    const ring = getComputedStyle(tileOf(content).shadowRoot.querySelector("ha-tile-icon"), "::after");
    check("status light", ring.content !== "none" && ring.position === "absolute" && ring.zIndex === "1" && ring.borderRadius === "50%"
      && ring.borderTopWidth === "3px" && ring.borderTopStyle === "solid",
      `drawn on the tile's icon, 3 px wide, over the picture, so its shading does not darken it (${ring.borderTopWidth} ${ring.zIndex})`);
    check("status light", !tileOf(offStyled).hasAttribute("xtool-light"), "none while the laser is off");
    check("status light", tileOf(closedAtLoad).getAttribute("xtool-light") === "solid" && tileOf(closedAtLoad).style.getPropertyValue("--xtool-light") === "#ffffff",
      "the P2 ring light: white while idle");
    check("status light", !tileOf(noLight).hasAttribute("xtool-light"), "none when turned off");

    // The corners: the same expanded as collapsed
    const roundCard = (expanded) => {
      const card = addCard(expanded ? "round, expanded" : "round, collapsed", { collapsible: true, expanded_at_load: expanded, ...jobFeatures }, { height: expanded ? 200 : 56 });
      card.parentElement.style.setProperty("--ha-card-border-radius", "60px");
      return card;
    };
    const roundOpen = roundCard(true), roundClosed = roundCard(false);
    const plainOpen = addCard("theme corners, expanded", { collapsible: true, expanded_at_load: true, ...jobFeatures }, { height: 200 });
    await wait(150);
    const cornerOf = (card) => getComputedStyle(card.shadowRoot.querySelector(".frame")).borderTopLeftRadius;
    const tileCorner = (card) => getComputedStyle(tileOf(card).shadowRoot.querySelector("ha-card")).borderTopLeftRadius;
    check("corners", cornerOf(roundOpen) === cornerOf(roundClosed) && tileCorner(roundOpen) === cornerOf(roundOpen) && Math.abs(parseFloat(cornerOf(roundOpen)) - 28) <= 1,
      `a theme's corners rounder than the collapsed card allows are kept as the collapsed card shows them (${cornerOf(roundOpen)}, ${tileCorner(roundOpen)}, ${cornerOf(roundClosed)})`);
    check("corners", cornerOf(plainOpen) === "12px", "the theme's corners otherwise");
  });
</script>
