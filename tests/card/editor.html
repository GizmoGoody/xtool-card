<!doctype html>
<meta charset="utf-8">
<title>xTool card: editor</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 13px Roboto, "Segoe UI", sans-serif; }
  pre { white-space: pre-wrap; }
</style>
<script src="stand-ins.js"></script>
<script src="../../xtool-card.js"></script>
<script src="checks.js"></script>
<div id="cards"></div>
<pre id="report" data-result="running">running</pre>
<script>
  runChecks(async () => {
    // A new card from the card picker: the first laser, in its own style
    const stub = customElements.get("xtool-card").getStubConfig(makeHass());
    check("new card", stub.entity === "sensor.f2_status" && stub.style === "f2_ultra_uv", "the F2 Ultra UV, in the F2 Ultra UV style");
    check("new card", stub.features.map((f) => f.type).join() === "custom:xtool-job,custom:xtool-controls", "with the Job and Controls features");
    check("new card", Object.keys(stub).join() === "entity,style,features" && stub.features.every((f) => Object.keys(f).join() === "type"),
      `every other option at its default, not written (${Object.keys(stub).join(", ")})`);
    // A P2 without job buttons (as the integration has it): no Job feature
    const p2Only = makeHass();
    const jobButtons = ["button.p2_pause", "button.p2_resume", "button.p2_cancel"];
    p2Only.entities = Object.fromEntries(Object.entries(p2Only.entities)
      .filter(([id, e]) => !jobButtons.includes(id) && !(e.platform === "xtool" && e.translation_key === "status" && id !== "sensor.p2_status")));
    for (const id of jobButtons) delete p2Only.states[id];
    const p2Stub = customElements.get("xtool-card").getStubConfig(p2Only);
    check("new card", p2Stub.entity === "sensor.p2_status" && p2Stub.style === "p2" && p2Stub.features.map((f) => f.type).join() === "custom:xtool-controls",
      `the P2, in the P2 style, with Controls only: it has no job buttons (${JSON.stringify(p2Stub)})`);
    const noLaser = makeHass();
    noLaser.entities = {};
    check("new card", JSON.stringify(customElements.get("xtool-card").getStubConfig(noLaser)) === JSON.stringify({ entity: "" }), "without an xTool laser: the entity alone, to choose");
    check("new card", window.customCards.some((c) => c.type === "xtool-card"), "offered in the card picker");

    const editor = document.createElement("xtool-card-editor");
    let fired;
    editor.addEventListener("config-changed", (ev) => (fired = ev.detail.config));
    editor.hass = makeHass();
    editor.setConfig({ type: "custom:xtool-card", entity: "sensor.f2_status", style: "f2_ultra_uv", features: [{ type: "custom:xtool-job" }] });
    document.getElementById("cards").append(editor);
    await wait(150);

    check("editor", fired === undefined, "a configuration with no option at its default is saved as it is");
    const form = editor.shadowRoot.getElementById("form");
    const styleForm = editor.shadowRoot.getElementById("style");
    const names = [...styleForm.schema, ...form.schema].map((s) => s.name);
    check("editor", ["style", "features_style", "status_badge", "connection_badge", "status_light", "progress_edge"].every((n) => names.includes(n)), `the xTool options (${names.join(", ")})`);
    check("editor", [styleForm, form].some((f) => f.data.features_style === "console"), "the features style is Console by default");
    const cardHelpers = [];
    const collect = (schema) => (schema ?? []).forEach((f) => { if (f.helper) cardHelpers.push(f.helper); collect(f.schema); });
    collect([...styleForm.schema, ...form.schema]);
    check("editor notes", cardHelpers.some((h) => h.includes("progress sensor")) && !cardHelpers.some((h) => /F2|P2|Ultra|deep camera/.test(h)),
      "no note names a model or its camera");
    check("status light", form.data.status_light === true, "the status light is on by default");
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "f2_ultra_uv", status_light: false } } }));
    check("status light", fired.status_light === false, "and can be turned off");
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "f2_ultra_uv", status_light: true } } }));
    check("status light", !("status_light" in fired), "turned on again, the default, it is left out");

    // The laser: a device picker, which fills in the laser's Status sensor
    const laserForm = editor.shadowRoot.getElementById("laser");
    const laserField = laserForm.schema[0];
    check("laser", laserField.name === "device" && laserField.selector.device.integration === "xtool" && laserForm.data.device === "dev_f2",
      "a device picker for xTool lasers, showing the card's laser");
    laserForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { device: "dev_p2" } } }));
    check("laser", fired.entity === "sensor.p2_status", "choosing a laser sets its Status sensor");
    laserForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { device: "dev_f2" } } }));
    check("laser", fired.entity === "sensor.f2_status", "and back");
    check("editor", styleForm.data.style === "f2_ultra_uv", "the style is shown");
    const styleChoices = styleForm.schema.find((f) => f.name === "style").selector.select.options;
    check("editor", styleChoices.map((o) => `${o.value}=${o.label}`).join() === "none=None (theme),f2_ultra_uv=F2 Ultra UV,p2=P2",
      `the styles, by the model each is drawn from (${styleChoices.map((o) => o.label).join(", ")})`);

    // Randomize reflections: a new pattern for the window's reflections
    const randomize = editor.shadowRoot.getElementById("randomize");
    check("reflections", !("pattern" in fired), "the default pattern is not written");
    check("reflections", randomize?.textContent === "Randomize reflections" && editor.shadowRoot.getElementById("row").style.display === "",
      "Randomize reflections is offered with a style");
    randomize.click();
    check("reflections", Number.isInteger(fired.pattern) && fired.pattern >= 1 && fired.style === "f2_ultra_uv" && !("features_style" in fired),
      `a click saves a new pattern (${fired.pattern}) and keeps the other options`);
    check("editor", form.data.status_badge.join() === "alarm,safety_key,safety_checks" && form.data.connection_badge === true, "the default badges are shown: of the defaults, those the F2 Ultra UV has (it has no lid sensor)");
    const badgeField = form.schema.find((s) => s.name === "status_badge");
    check("badges", badgeField.selector.select.options.map((o) => o.value).join() === "alarm,safety_key,safety_checks,firmware",
      `the F2 Ultra UV is offered every badge but Lid (${badgeField.selector.select.options.map((o) => o.value).join(", ")})`);
    check("badges", badgeField.selector.select.options.map((o) => o.label).join() === "Alarm or fire warning,Safety key removed,A safety check is off,Firmware update available",
      "each by what it shows");
    // The P2: no safety key, and no safety check that can be off (its flame alarm is a level)
    const badgeEditor = document.createElement("xtool-card-editor");
    let badgeFired;
    badgeEditor.addEventListener("config-changed", (ev) => (badgeFired = ev.detail.config));
    badgeEditor.hass = makeHass();
    badgeEditor.setConfig({ type: "custom:xtool-card", entity: "sensor.p2_status", style: "p2" });
    document.getElementById("cards").append(badgeEditor);
    await wait(150);
    const badgeForm = badgeEditor.shadowRoot.getElementById("form");
    const p2Badges = badgeForm.schema.find((s) => s.name === "status_badge").selector.select.options.map((o) => o.value);
    check("badges", p2Badges.join() === "alarm,lid,firmware" && badgeForm.data.status_badge.join() === "alarm,lid",
      `the P2 is offered only the badges it has, and its defaults are those of the defaults it has (${p2Badges.join(", ")}; ${badgeForm.data.status_badge.join(", ")})`);
    badgeForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "p2", status_badge: ["alarm", "lid"] } } }));
    check("badges", badgeFired && !("status_badge" in badgeFired) && !("connection_badge" in badgeFired), "the P2's defaults are not written");
    badgeForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "p2", status_badge: ["alarm", "lid", "firmware"] } } }));
    check("badges", badgeFired.status_badge.join() === "alarm,lid,firmware", "other choices are written");
    badgeForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "p2", connection_badge: false } } }));
    check("badges", badgeFired.connection_badge === false, "the connection badge turned off is written");
    badgeEditor.remove();
    check("editor", badgeField.selector.select.reorder === true && badgeField.selector.select.multiple === true, "the badges can be put in order");
    check("editor", badgeField.label === "Status badge (in priority order)" && badgeField.helper === "The first one that applies shows at the top right of the picture.", "and are labeled as in priority order");
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "f2_ultra_uv", status_badge: ["lid", "alarm", "safety_key"] } } }));
    check("editor", fired.status_badge.join() === "lid,alarm,safety_key", "the order chosen is the order saved");

    const tile = editor.shadowRoot.querySelector("xtool-tile-card-editor");
    check("editor", !!tile, "the tile card's own editor is inside");
    check("editor", tile && !/"name":"icon"|"name":"show_entity_picture"/.test(tile.schemaNames), "without the icon options (the card draws the picture)");
    check("editor", tile && !/"name":"entity"/.test(tile.schemaNames), "without the tile card's entity picker (the laser is chosen above)");
    check("editor", tile?.config && !("style" in tile.config) && tile.config.show_entity_picture === true, "the tile editor gets only tile card options");
    // The tile editor gets Home Assistant's own hass (its action editors need all of it, such as a service's target);
    // the card's attributes reach the State content picker through the states context below
    check("editor", !("elapsed" in tile.hass.states["sensor.f2_status"].attributes), "the tile editor gets Home Assistant's own hass");
    // The State content picker reads the state from Home Assistant's "states" context
    const request = new Event("context-request", { bubbles: true, composed: true });
    let fromContext, calls = 0;
    Object.assign(request, { context: "states", subscribe: true, callback: (states) => { fromContext = states; calls += 1; } });
    tile.dispatchEvent(request);
    check("editor", fromContext?.["sensor.f2_status"]?.attributes.wifi_signal === "-52 dBm" && fromContext["sensor.f2_status"].attributes.elapsed === "12:08",
      "the states context inside the editor has the card's attributes");
    editor.hass = makeHass({ "sensor.f2_wifi_signal": "-60" });
    check("editor", calls === 2 && fromContext["sensor.f2_status"].attributes.wifi_signal === "-60 dBm", "and follows new states");

    // The xTool options change
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "none", status_badge: ["alarm"], progress_edge: { edge: "bottom" } } } }));
    check("editor", !("style" in fired) && !("features_style" in fired) && !("pattern" in fired), "no style written for None, and no features style or pattern without an xTool style");
    check("reflections", editor.shadowRoot.getElementById("row").style.display === "none", "no Randomize reflections without a style");
    check("editor", fired.status_badge.join() === "alarm" && JSON.stringify(fired.progress_edge) === JSON.stringify({ edge: "bottom" }),
      `badges and the progress edge are saved, the edge with only the options that differ from the defaults (${JSON.stringify(fired.progress_edge)})`);
    check("editor", !editor.shadowRoot.getElementById("form").schema.some((s) => s.name === "features_style"), "the features style is hidden");

    // Tap to show or hide the features
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "none", collapsible: true, expanded_at_load: false } } }));
    check("editor", !("collapsible" in fired) && fired.expanded_at_load === false && !("collapse_when_powered_off" in fired) && !("expand_when_powered_on" in fired),
      "the collapse options are saved; Collapsible, Collapse when powered off and Expand when powered on, on by default, are left out");
    check("editor", editor.shadowRoot.getElementById("form").data.collapsible === true, "Collapsible is on by default");
    const formSchema = editor.shadowRoot.getElementById("form").schema;
    check("editor", formSchema.find((s) => s.name === "expanded_at_load")?.label === "Expanded at load", "Expanded at load is offered");
    const powerOptions = formSchema.map((s) => s.name).filter((n) => ["collapse_when_powered_off", "expand_when_powered_on"].includes(n));
    check("editor", formSchema.find((s) => s.name === "collapse_when_powered_off")?.label === "Collapse when powered off"
      && formSchema.find((s) => s.name === "expand_when_powered_on")?.label === "Expand when powered on" && powerOptions.join() === "collapse_when_powered_off,expand_when_powered_on",
      "Collapse when powered off is offered, with Expand when powered on after it");
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "none", collapsible: false } } }));
    check("editor", fired.collapsible === false && !("expanded_at_load" in fired) && !("collapse_when_powered_off" in fired) && !("expand_when_powered_on" in fired)
      && !editor.shadowRoot.getElementById("form").schema.some((s) => s.name === "expanded_at_load"), "turned off, it is saved, and the options under it are removed");

    // Last feature full width: on by default, offered with the features beside the title
    const lastOption = () => editor.shadowRoot.getElementById("form").schema.find((s) => s.name === "last_feature_full_width");
    check("editor", lastOption()?.label === "Last feature full width" && editor.shadowRoot.getElementById("form").data.last_feature_full_width === true,
      "Last feature full width is offered, on by default");
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "none", last_feature_full_width: false } } }));
    check("editor", fired.last_feature_full_width === false, "turned off, it is saved");
    form.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { style: "none", last_feature_full_width: true } } }));
    check("editor", !("last_feature_full_width" in fired), "on, it is left out");
    // A camera's Full width: on by default, left out while on
    const cameraEditor = document.createElement("xtool-feature-editor");
    let cameraFired;
    cameraEditor.addEventListener("config-changed", (ev) => (cameraFired = ev.detail.config));
    cameraEditor.hass = makeHass();
    cameraEditor.context = { entity_id: "sensor.f2_status" };
    cameraEditor.setConfig({ type: "custom:xtool-camera" });
    const cameraForm = cameraEditor.querySelector("ha-form");
    check("camera, full width", cameraForm.schema.find((s) => s.name === "full_width")?.label === "Full width" && cameraForm.data.full_width === true, "offered, on by default");
    cameraForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { ...cameraForm.data, full_width: false } } }));
    check("camera, full width", JSON.stringify(cameraFired) === JSON.stringify({ type: "custom:xtool-camera", full_width: false }), `turned off, it alone is saved (${JSON.stringify(cameraFired)})`);
    cameraForm.dispatchEvent(new CustomEvent("value-changed", { detail: { value: { ...cameraForm.data, full_width: true } } }));
    check("camera, full width", JSON.stringify(cameraFired) === JSON.stringify({ type: "custom:xtool-camera" }), "on, it is left out");

    // The tile card's options change
    tile.dispatchEvent(new CustomEvent("config-changed", { detail: { config: { type: "tile", entity: "sensor.f2_status", name: "Laser", show_entity_picture: true } } }));
    check("editor", fired.type === "custom:xtool-card" && fired.name === "Laser" && !("style" in fired) && !("show_entity_picture" in fired),
      "the tile options are kept with the card's own");
    // The tile card's options the card gives defaults: Features position beside the title, and the laser's own State content
    check("editor", tile.config.features_position === "inline" && tile.config.state_content.join() === "state,engraving_lens,elapsed",
      `the tile editor shows the card's defaults (${tile.config.features_position}; ${tile.config.state_content.join(", ")})`);
    tile.dispatchEvent(new CustomEvent("config-changed", { detail: { config: { ...tile.config, name: "Laser 2" } } }));
    check("editor", fired.name === "Laser 2" && !("features_position" in fired) && !("state_content" in fired), "and leaves them out while they are the defaults");
    tile.dispatchEvent(new CustomEvent("config-changed", { detail: { config: { ...tile.config, features_position: "bottom", state_content: ["state"] } } }));
    check("editor", fired.features_position === "bottom" && fired.state_content.join() === "state", "but saves other choices");
    check("editor", !editor.shadowRoot.getElementById("form").schema.some((s) => s.name === "last_feature_full_width"),
      "with the features at the bottom (one column), Last feature full width is not offered");
    const p2Editor = document.createElement("xtool-card-editor");
    p2Editor.hass = makeHass();
    p2Editor.setConfig({ type: "custom:xtool-card", entity: "sensor.p2_status" });
    document.getElementById("cards").append(p2Editor);
    await wait(150);
    const p2Tile = p2Editor.shadowRoot.querySelector("xtool-tile-card-editor");
    check("editor", p2Tile?.config.state_content.join() === "state,elapsed", "a laser without an engraving lens sensor: the state and the time it has run");

    // A card refuses options it does not know
    const card = document.createElement("xtool-card");
    let error = "";
    try {
      card.setConfig({ type: "custom:xtool-card", entity: "sensor.f2_status", style: "gold" });
    } catch (err) {
      error = err.message;
    }
    check("card", error === "Unknown style: gold", "an unknown style is reported");
  });
</script>
